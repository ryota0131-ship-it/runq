  function genId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ============================================================
     common Workout model
     画面やOS固有の値を直接扱わず、すべてここでRUNQ.共通形式へ正規化する。
     workoutUserId は認証導入前の端末内識別子。認証導入後はAuthのuser_idへ差し替える。
  ============================================================ */
  const WORKOUT_SOURCES = ['manual','screenshot','apple_health','health_connect','strava','garmin'];
  function workoutPaceSeconds(value, distanceMeters, durationSeconds){
    if(value!=null && value!==''){
      const seconds = typeof value==='number' ? value : hmsToSeconds(String(value).replace('/km',''));
      if(seconds!=null && seconds>0) return Math.round(seconds);
    }
    return distanceMeters>0 && durationSeconds>0 ? Math.round(durationSeconds/(distanceMeters/1000)) : null;
  }
  function normalizeWorkout(raw){
    const now = new Date().toISOString();
    const source = WORKOUT_SOURCES.indexOf(raw.source)>=0 ? raw.source : 'manual';
    const distanceMeters = raw.distance_meters!=null ? Number(raw.distance_meters) : Number(raw.distanceKm||0)*1000;
    const durationSeconds = raw.duration_seconds!=null ? Number(raw.duration_seconds) : Number(raw.durationMin||0)*60;
    const startedAt = raw.started_at || raw.startedAt || (raw.date ? raw.date+'T12:00:00.000' : now);
    const endedAt = raw.ended_at || raw.endedAt || (durationSeconds>0 ? new Date(new Date(startedAt).getTime()+durationSeconds*1000).toISOString() : null);
    return {
      id: raw.id || genId('workout_'),
      user_id: raw.user_id || (state.profile&&state.profile.workoutUserId) || null,
      started_at: startedAt,
      ended_at: endedAt,
      duration_seconds: durationSeconds>0 ? Math.round(durationSeconds) : null,
      distance_meters: distanceMeters>0 ? Math.round(distanceMeters) : null,
      average_pace_seconds_per_km: workoutPaceSeconds(raw.average_pace_seconds_per_km!=null ? raw.average_pace_seconds_per_km : raw.avgPace, distanceMeters, durationSeconds),
      average_heart_rate: raw.average_heart_rate!=null ? Number(raw.average_heart_rate) : (raw.avgHr!=null ? Number(raw.avgHr) : null),
      max_heart_rate: raw.max_heart_rate!=null ? Number(raw.max_heart_rate) : null,
      calories: raw.calories!=null ? Number(raw.calories) : null,
      source: source,
      source_workout_id: raw.source_workout_id || raw.sourceWorkoutId || null,
      source_device: raw.source_device || raw.sourceDevice || null,
      imported_at: raw.imported_at || raw.importedAt || now,
      created_at: raw.created_at || raw.createdAt || now,
      updated_at: now,
      plan_id: raw.plan_id || null,
      scheduled_item_ref: raw.scheduled_item_ref || null,
      scheduled_item_date: raw.scheduled_item_date || null,
      completion_status: raw.completion_status || null
    };
  }
  function isDuplicateWorkout(existing, next){
    if(existing.source===next.source && existing.source_workout_id && next.source_workout_id && existing.source_workout_id===next.source_workout_id) return true;
    const startGap = Math.abs(new Date(existing.started_at).getTime()-new Date(next.started_at).getTime());
    const distanceGap = Math.abs(Number(existing.distance_meters||0)-Number(next.distance_meters||0));
    const durationGap = Math.abs(Number(existing.duration_seconds||0)-Number(next.duration_seconds||0));
    return startGap<=10*60*1000 && distanceGap<=150 && durationGap<=3*60;
  }
  function matchWorkoutToPlan(workout){
    const dateStr = String(workout.started_at||'').slice(0,10);
    const plan = currentPlan();
    const found = plan && findItemByDate(plan, dateStr);
    if(!found || !isLoggable(found.it)) return workout;
    const itemRef = plan.id+':w'+found.wi+'-i'+found.ii;
    return Object.assign({}, workout, {
      plan_id: plan.id,
      scheduled_item_ref: itemRef,
      scheduled_item_date: dateStr,
      completion_status: 'matched'
    });
  }
  async function upsertWorkout(raw){
    const next = matchWorkoutToPlan(normalizeWorkout(raw));
    const entries = Array.isArray(state.workouts) ? state.workouts.slice() : [];
    const index = entries.findIndex(function(entry){ return isDuplicateWorkout(entry, next); });
    if(index>=0){
      next.id = entries[index].id;
      next.created_at = entries[index].created_at || next.created_at;
      entries[index] = Object.assign({}, entries[index], next);
    }else entries.unshift(next);
    state.workouts = entries;
    await Store.setWorkouts(entries);
    return next;
  }
  function workoutFromLog(plan, dateStr, log){
    return {
      user_id: state.profile&&state.profile.workoutUserId,
      date: dateStr,
      distanceKm: log.distanceKm,
      durationMin: log.durationMin,
      avgPace: log.avgPace,
      avgHr: log.avgHr,
      calories: log.calories,
      source: log.source || 'manual',
      source_workout_id: (log.source||'manual')+':'+plan.id+':'+dateStr,
      imported_at: log.loggedAt,
      plan_id: plan.id
    };
  }

  /* Native Health adapter -------------------------------------------------
     CapacitorのHealthプラグインだけをこの境界で扱い、画面側へは共通Workout
     しか返さない。Web/Vercelではwindow.Capacitorが無いため常に安全に失敗する。 */
  function nativeHealthPlugin(){
    const capacitor = window.Capacitor;
    if(!capacitor || !capacitor.isNativePlatform || !capacitor.isNativePlatform()) return null;
    if(capacitor.Plugins && capacitor.Plugins.Health) return capacitor.Plugins.Health;
    return typeof capacitor.registerPlugin==='function' ? capacitor.registerPlugin('Health') : null;
  }

  // Capacitor版は端末内の https://localhost で画面を開くため、相対URLのままでは
  // VercelのServerless Functionへ届かない。公開APIのURLだけをここに集約し、
  // Web/Vercel版では従来どおり同一オリジンの相対URLを使う。
  const RUNQ_NATIVE_API_ORIGIN = 'https://runq-umber.vercel.app';
  function isNativeRuntime(){
    const capacitor = window.Capacitor;
    return !!(capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform());
  }
  function apiEndpoint(path){
    return isNativeRuntime() ? RUNQ_NATIVE_API_ORIGIN+path : path;
  }
  function healthConnectionKey(platform){ return platform==='ios' ? 'appleHealth' : 'healthConnect'; }
  async function heartRateForWorkout(plugin, workout){
    try{
      const result = await plugin.readSamples({ dataType:'heartRate', startDate:workout.startDate, endDate:workout.endDate, limit:1000, ascending:true });
      const values = (result.samples||[]).map(function(sample){ return Number(sample.value); }).filter(function(value){ return value>0; });
      if(!values.length) return { average:null, max:null };
      return { average:Math.round(values.reduce(function(total, value){ return total+value; },0)/values.length), max:Math.round(Math.max.apply(null,values)) };
    }catch(e){ return { average:null, max:null }; }
  }
  async function healthWorkoutToRunq(plugin, workout, platform){
    const heartRate = await heartRateForWorkout(plugin, workout);
    return {
      started_at: workout.startDate,
      ended_at: workout.endDate,
      duration_seconds: workout.duration,
      distance_meters: workout.totalDistance,
      average_heart_rate: heartRate.average,
      max_heart_rate: heartRate.max,
      calories: workout.totalEnergyBurned,
      source: platform==='ios' ? 'apple_health' : 'health_connect',
      source_workout_id: workout.platformId || [workout.sourceId||'native', workout.startDate, workout.endDate].join(':'),
      source_device: workout.sourceName || workout.sourceId || null
    };
  }
  async function reflectImportedWorkout(workout){
    if(!state.profile.healthConnections || state.profile.healthConnections.autoImport===false) return false;
    if(workout.plan_id!==state.currentId || !workout.scheduled_item_date || !workout.scheduled_item_ref) return false;
    const existing = state.logs[workout.scheduled_item_date];
    // ユーザーが自分で入力・修正した記録は、端末連携で上書きしない。
    if(existing && existing.source!=='apple_health' && existing.source!=='health_connect') return false;
    const items = workout.scheduled_item_ref.match(/:w(\d+)-i(\d+)$/);
    const entries = Object.assign({}, state.logs);
    entries[workout.scheduled_item_date] = Object.assign({}, existing||{}, {
      distanceKm: workout.distance_meters ? Number((workout.distance_meters/1000).toFixed(2)) : null,
      avgPace: workout.average_pace_seconds_per_km ? paceSecToLabel(workout.average_pace_seconds_per_km) : null,
      avgHr: workout.average_heart_rate || null,
      durationMin: workout.duration_seconds ? Number((workout.duration_seconds/60).toFixed(1)) : null,
      calories: workout.calories || null,
      source: workout.source,
      sourceWorkoutId: workout.source_workout_id,
      imageImport: null,
      loggedAt: workout.imported_at
    });
    state.logs = entries;
    await Store.setLogs(state.currentId, entries);
    if(items){
      state.completed['w'+items[1]+'-'+items[2]] = true;
      await Store.setProgress(state.currentId, state.completed);
    }
    return true;
  }
  async function syncHealthWorkouts(requestedPlatform){
    const plugin = nativeHealthPlugin();
    if(!plugin) throw new Error('native_only');
    const availability = await plugin.isAvailable();
    if(!availability || !availability.available) throw new Error('unavailable');
    const platform = availability.platform;
    const connectionKey = healthConnectionKey(platform);
    if(requestedPlatform && requestedPlatform!==connectionKey) throw new Error('wrong_platform');
    const permission = await plugin.requestAuthorization({ read:['workouts','heartRate','distance','calories'], write:[], requestHistoryAccess:true });
    if((permission.readDenied||[]).indexOf('workouts')>=0) throw new Error('permission_denied');
    const endDate = new Date().toISOString();
    const startDate = new Date(Date.now()-90*86400000).toISOString();
    let anchor = null, imported = 0, matched = 0, pages = 0;
    do {
      const result = await plugin.queryWorkouts({ workoutType:'running', startDate:startDate, endDate:endDate, limit:100, ascending:false, anchor:anchor||undefined });
      const workouts = result.workouts || [];
      for(const nativeWorkout of workouts){
        const saved = await upsertWorkout(await healthWorkoutToRunq(plugin, nativeWorkout, platform));
        imported++;
        if(await reflectImportedWorkout(saved)) matched++;
      }
      anchor = result.anchor || null;
      pages++;
    } while(anchor && pages<20);
    const connections = state.profile.healthConnections||{};
    connections[connectionKey] = Object.assign({}, connections[connectionKey]||{}, {enabled:true,lastSyncedAt:new Date().toISOString()});
    state.profile.healthConnections = connections;
    await Store.setProfile(state.profile);
    state.healthImportNotice = imported ? { count:imported, matched:matched } : null;
    return { imported:imported, matched:matched, connectionKey:connectionKey };
  }
  function healthErrorMessage(error){
    const code = error && error.message;
    if(code==='native_only') return 'ヘルスケア連携はRUNQ.のiPhone／Androidアプリで利用できます';
    if(code==='unavailable') return 'この端末ではヘルスケア連携を利用できません';
    if(code==='wrong_platform') return 'この端末では選択したデータ連携を利用できません';
    if(code==='permission_denied') return 'ヘルスケアへのアクセスが許可されていません。端末の設定から変更してください';
    return '同期できませんでした。権限と端末のヘルスケア設定を確認してください';

  // シューズ累計距離に加え、マイページのRUNNER PROFILEサマリーに使う「最長RUN」も同じログ走査で
  // まとめて算出する(全プラン横断で記録された1回の走行距離の最大値。新規の永続化は行わず毎回計算)
  async function refreshShoeMileage(){
    const mileage = {};
    let longestRunKm = null;
    for(const p of state.plans){
      let logs = {};
      try{ logs = await Store.getLogs(p.id); }catch(e){ logs = {}; }
      Object.keys(logs).forEach(function(dateStr){
        const log = logs[dateStr];
        if(log && log.shoeId && log.distanceKm){
          mileage[log.shoeId] = (mileage[log.shoeId]||0) + Number(log.distanceKm);
        }
        if(log && log.distanceKm && (longestRunKm==null || Number(log.distanceKm)>longestRunKm)){
          longestRunKm = Number(log.distanceKm);
        }
      });
    }
    state.shoeMileage = mileage;
    state.runnerStats = { longestRunKm: longestRunKm };
    if(state.mode==='profile') render();
  }

  function effectiveLongestRunKm(profile){
    const auto = state.runnerStats && state.runnerStats.longestRunKm;

    const manual = profile && Number(profile.longestRunManualKm);
    return manual>0 ? { km:manual, source:'手動で設定' } : { km:null, source:'未設定' };
  }

      + '<button type="button" class="tab-btn'+(pc.mode==='pace2time'?' active':'')+'" style="width:100%;" data-action="pace-calc-mode" data-mode="pace2time">ペース→タイム</button>'

    if(pc.mode==='time2pace'){
      html += '<div class="field"><label>目標タイム</label>'+timePickerHTML('pc', pc.h, pc.m, pc.s)+'</div>';
    } else {
      html += '<div class="field"><label>平均ペース</label><div class="time-picker">'
        + plainSelectHTML('pcPaceM', rangeArray(3,15,1), pc.paceM)
        + '<span class="unit">分</span>'
        + plainSelectHTML('pcPaceS', rangeArray(0,55,5), pc.paceS, function(v){ return pad(v); })
        + '<span class="unit">秒/km</span></div></div>';
    }
    html += '</form>';
    let paceSecPerKm = null, goalSec = null;
    if(pc.mode==='time2pace'){
      goalSec = pc.h*3600+pc.m*60+pc.s;
      paceSecPerKm = (goalSec && pc.distanceKm) ? goalSec/pc.distanceKm : null;
    } else {
      paceSecPerKm = pc.paceM*60+pc.paceS;
      goalSec = (paceSecPerKm && pc.distanceKm) ? Math.round(paceSecPerKm*pc.distanceKm) : null;
    }
    if(paceSecPerKm && goalSec){
      html += '<div class="pace-preview mono" style="margin-top:12px;">'
        + (pc.mode==='time2pace' ? '必要平均ペース 約 '+paceSecToLabel(paceSecPerKm)+'/km' : '予想ゴールタイム 約 '+secToHMSLabel(goalSec))

          return '<li class="'+(sp.label==='GOAL'?'sim-input':'')+'"><span class="sim-dist">'+sp.label+'</span><span class="sim-time mono">'+secToHMSLabel(sp.sec)+'</span></li>';
        }).join('')+'</ul>';
      }
    }
    html += '</div></div></div>';
    return html;
  }

  function logSummaryLine(log){
    const parts = [];
    if(log.distanceKm!=null && log.distanceKm!=='') parts.push(formatKm(Number(log.distanceKm)));
    if(log.avgPace) parts.push(log.avgPace+'/km');
    if(log.avgHr!=null && log.avgHr!=='') parts.push('平均心拍'+log.avgHr+'bpm');
    if(log.durationMin!=null && log.durationMin!=='') parts.push(Math.round(Number(log.durationMin))+'分');
    if(log.calories!=null && log.calories!=='') parts.push(log.calories+'kcal');
    if(log.shoeId){
      const shoe = (state.profile.shoes||[]).find(s=>s.id===log.shoeId);
      if(shoe) parts.push('シューズ: '+shoe.name);
    }
    if(log.rpe) parts.push('RPE'+log.rpe);
    if(log.completionType && log.completionType!=='as_planned'){
      parts.push(COMPLETION_TYPE_LABEL[log.completionType]||log.completionType);
    }
    if(log.pain && log.pain.level>0){
      parts.push('痛み: '+(PAIN_LEVEL_LABEL[log.pain.level]||'あり')+(log.pain.parts&&log.pain.parts.length?'('+log.pain.parts.join('・')+')':''));
    }
    return parts.join(' ・ ') || '記録あり';
  }

  // 画像から読み取った3項目は、表示値を変えずに算術的な矛盾だけを知らせる。
  // AIの推測で補正せず、最終判断は常にユーザーに委ねる。
  function screenshotConsistencyMessage(values){
    const distance = Number(values.distanceKm);
    const duration = Number(values.durationMin);
    const pace = String(values.avgPace || '');
    const match = pace.match(/^(\d{1,2}):(\d{2})$/);
    if(!(distance>0 && duration>0 && match)) return '';
    const statedSec = Number(match[1])*60 + Number(match[2]);
    const calculatedSec = duration*60/distance;
    return Math.abs(statedSec-calculatedSec)>25
      ? '距離・時間から計算したペースと読み取り値に差があります。画像を確認して必要なら修正してください。'
      : '';
  }

  function existingLogWarning(dateStr, values, prefill){
    if(!prefill || !values || !values.distanceKm) return '';
    const sameDistance = prefill.distanceKm!=null && Math.abs(Number(prefill.distanceKm)-Number(values.distanceKm))<0.15;
    const sameDuration = !prefill.durationMin || !values.durationMin || Math.abs(Number(prefill.durationMin)-Number(values.durationMin))<3;
    return sameDistance && sameDuration
      ? 'この日に似た記録がすでにあります。重複登録ではないか確認してください。'
      : '';
  }

  function itemRowHTML(plan, wi, ii, it, today){
    const passed = it.date ? today>=parseISO(it.date) : false;
    const canCheck = checkableTypes(it, passed);
    const key = 'w'+wi+'-'+ii;
    const isDone = !!state.completed[key];

  function orderedPlansForDisplay(){
    // 大会同士のつながり(meta.linkedFromPlanId)に沿って、親の直後に子が並ぶ順序に組み替える
    const byId = {};
    state.plans.forEach(function(p){ byId[p.id]=p; });
    const childrenOf = {};
    state.plans.forEach(function(p){
      const parentId = p.meta.linkedFromPlanId;
      if(parentId && byId[parentId]){
        childrenOf[parentId] = childrenOf[parentId] || [];
        childrenOf[parentId].push(p);
      }
    });
    const visited = {};
    const ordered = [];
    function visit(p){
      if(visited[p.id]) return;
      visited[p.id] = true;
      ordered.push(p);
      (childrenOf[p.id]||[]).forEach(visit);
    }
    state.plans.forEach(function(p){
      const parentId = p.meta.linkedFromPlanId;
      if(!parentId || !byId[parentId]) visit(p);
    });
    state.plans.forEach(function(p){ if(!visited[p.id]) visit(p); });
    return ordered;
  }

  function calendarHTML(plan, today){
    if(!state.calendarMonth) state.calendarMonth = toISO(today).slice(0,7);
    const parts = state.calendarMonth.split('-').map(Number);
    const cy = parts[0], cm = parts[1];
    const monthStart = new Date(cy, cm-1, 1);
    const monthLabel = cy+'年 '+cm+'月';

    const dateMap = {};
    plan.weeks.forEach((wk,wi)=>{
      wk.items.forEach((it,ii)=>{
        if(it.date){
          if(!dateMap[it.date]) dateMap[it.date] = [];
          dateMap[it.date].push({it:it, wi:wi, ii:ii});
        }
      });
    });

    const firstWeekday = monthStart.getDay();
    const daysInMonth = new Date(cy, cm, 0).getDate();
    const todayStr = toISO(today);
    const selected = state.calendarSelected;

    let html = '<div class="calendar-card">';
    html += '<div class="cal-nav"><button type="button" class="cal-nav-btn" data-action="cal-nav" data-dir="-1" aria-label="前の月">&#8249;</button><span class="cal-month mono">'+monthLabel+'</span><button type="button" class="cal-nav-btn" data-action="cal-nav" data-dir="1" aria-label="次の月">&#8250;</button></div>';
    html += '<div class="cal-grid cal-weekday-row">'+WEEKDAY_JA.map(w=>'<div class="cal-weekday">'+w+'</div>').join('')+'</div>';
    html += '<div class="cal-grid">';
    for(let i=0;i<firstWeekday;i++) html += '<div class="cal-cell empty"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = cy+'-'+pad(cm)+'-'+pad(d);
      const entries = dateMap[dateStr]||[];
      let cls = 'cal-cell';
      if(dateStr===todayStr) cls += ' today';
      if(dateStr===selected) cls += ' selected';
      if(entries.length) cls += ' has-item';
      html += '<button type="button" class="'+cls+'" data-action="cal-select" data-date="'+dateStr+'">';
      html += '<span class="cal-daynum">'+d+'</span>';
      if(entries.length){
        html += '<span class="cal-dots">'+entries.map(e=>'<span class="cal-dot '+e.it.type+'"></span>').join('')+'</span>';
        if(entries.some(e=>state.logs[e.it.date])) html += '<span class="cal-log-mark">&#10003;</span>';
      }
      html += '</button>';
    }
    html += '</div></div>';

    html += '<div class="cal-detail">';
    if(selected){
      const entries = dateMap[selected]||[];
      const sd = parseISO(selected);
      html += '<div class="cal-detail-date mono">'+fmtMD(sd)+'（'+WEEKDAY_JA[sd.getDay()]+'）</div>';
      if(entries.length){
        entries.forEach(e=>{ html += itemRowHTML(plan, e.wi, e.ii, e.it, today); });
      } else {
        html += '<div class="cal-detail-empty">この日の予定はありません</div>';
      }
    } else {
      html += '<div class="cal-detail-empty">日付をタップすると詳細が表示されます</div>';
    }
    html += '</div>';

    return html;
  }

  function findNextRun(plan, today){
    const todayStr = toISO(today);
    let best = null;
    plan.weeks.forEach(function(wk, wi){
      wk.items.forEach(function(it, ii){
        if(!it.date || it.type==='rest') return;
        if(it.date<=todayStr) return;
        if(!best || it.date<best.it.date) best = { it:it, wi:wi, ii:ii };
      });
    });
    return best;
  }

  function findCurrentWeek(plan, today){
    for(let i=0;i<plan.weeks.length;i++){
      const wk = plan.weeks[i];
      const dates = wk.items.map(it=>it.date).filter(Boolean).map(parseISO);
      if(!dates.length) continue;
      const wkStart = new Date(Math.min(...dates.map(d=>d.getTime())));
      const wkEnd = new Date(Math.max(...dates.map(d=>d.getTime())));
      if(today>=wkStart && today<=wkEnd) return { wi:i, wk:wk };
    }
    return null;
  }

  const TODAYS_POINT_TIPS = {
    mp: [
      'MPペースは「余裕を持って刻める」速さが目安。序盤から追い込みすぎない',
      '呼吸が乱れる手前のペースを保てているか、最初の1本で確認しよう',

    ],

    ]

  function todaysPointFor(it, dateStr){
    const tips = TODAYS_POINT_TIPS[it.type];
    if(!tips || !tips.length) return null;
    const key = dateStr+'-'+it.type;
    let hash = 0;
    for(let i=0;i<key.length;i++){ hash = (hash*31 + key.charCodeAt(i)) >>> 0; }
    return tips[hash % tips.length];
  }

    return html;
  }

  /* ============================================================
     AIコーチ — チャット形式のUI(Phase7)。plans/{id}のプランをAIと自然文で相談・調整する。
     やりとりは state.coach.messages に積み上げ、coachLog/{planId} に永続化して次回も続きから見られる。
     選択肢(options)の完全なプランJSONやundo用スナップショットは容量節約のため永続化せず、
     現在のセッション中(=まだページを再読み込みしていない間)のみ選択可能とする。
  ============================================================ */
  function coachChatHTML(){
    const a = state.adjust, c = state.coach;
    let html = '<div class="info-card adjust-card coach-chat-card">';
    html += '<h3>コーチ</h3>';
    html += '<div class="lede">プランや体調について、何でも相談できます。</div>';

    html += '<div class="chat-thread" id="coach-thread">';
    if(c.loading && !c.messages.length){
      html += '<div class="chat-empty">読み込み中…</div>';
    } else if(!c.messages.length){
      html += '<div class="chat-empty">まだ会話はありません。下から相談してみましょう。</div>';
    } else {
      html += c.messages.map(renderCoachMessage).join('');
    }
    if(a.busy){
      const elapsed = a.startedAt ? Math.max(0, Math.floor((Date.now()-a.startedAt)/1000)) : 0;
      const previewText = a.streamPreview || '';
      html += '<div class="chat-msg chat-coach"><div class="chat-bubble chat-typing">'
        + '<div class="chat-typing-row"><span class="typing-dots"><span></span><span></span><span></span></span><span class="typing-txt" id="adjust-elapsed-txt">'+adjustElapsedLabel(elapsed)+'</span></div>'
        + '<div class="chat-stream-preview" id="adjust-stream-preview"'+(previewText?'':' hidden')+'>'+escapeHtml(previewText)+'</div>'
        + '</div></div>';
    }
    html += '</div>';

    html += '<form id="adjust-form" class="chat-input-row">';
    html += '<textarea id="adjust-input" rows="1" placeholder="メッセージを入力" aria-label="コーチへのメッセージ" '+(a.busy?'disabled':'')+'>'+escapeHtml(a.draft||'')+'</textarea>';
    if(a.busy){
      html += '<button type="button" class="btn-secondary chat-cancel-btn" data-action="cancel-adjust">キャンセル</button>';
    } else {
      html += '<button type="submit" class="btn-primary chat-send-btn" aria-label="送信" title="送信"><span>↑</span></button>';
    }
    html += '</form>';
    html += '</div>';
    return html;
  }

  // 1件のチャットメッセージをHTML化する。kind==='options'のみ特殊(リスク表示+選択肢カード)で、
  // それ以外(advice/confirmed/dismissed/error、およびuser)は単純な吹き出し表示
  function renderCoachMessage(m){
    if(m.role==='user'){
      return '<div class="chat-msg chat-user"><div class="chat-bubble">'+escapeHtml(m.text||'')+'</div></div>';
    }
    if(m.kind==='options'){
      // interactive: このセッション中に生成された(=完全なplanデータをまだ保持している)、かつ未対応の提案のみ選択可能。
      // 再読み込み後は永続化時に間引かれたplanデータが無いため、履歴として表示のみになる
      const interactive = !m.resolved && m.prevPlan && Array.isArray(m.options) && m.options.every(function(o){ return !!o.plan; });
      let html = '<div class="chat-msg chat-coach"><div class="chat-bubble chat-bubble-options">';
      if(m.risk) html += '<div class="risk-callout">'+warnIcon()+'<span>'+escapeHtml(m.risk)+'</span></div>';
      html += '<div class="option-list">';
      (m.options||[]).forEach(function(opt){
        const isChosen = m.chosenOptionId===opt.id;
        html += '<div class="option-card'+(isChosen?' chosen':'')+'">'
          + '<div class="option-label">'+escapeHtml(opt.label)+(isChosen?' <span class="chosen-tag">選択済み</span>':'')+'</div>'
          + '<div class="option-summary">'+escapeHtml(opt.summary)+'</div>';
        if(interactive){
          html += '<button type="button" class="btn-primary option-choose-btn" data-action="choose-adjust-option" data-msgid="'+m.id+'" data-optid="'+opt.id+'">この案にする</button>';
        }
        html += '</div>';
      });
      html += '</div>';
      if(interactive){
        html += '<div class="adjust-actions"><button type="button" class="btn-secondary" data-action="dismiss-adjust-options" data-msgid="'+m.id+'">どちらも採用しない</button></div>';
      } else if(!m.chosenOptionId){
        html += '<div class="chat-stale-note">'+(m.resolved ? '(この提案は見送られました)' : '(ページの再読み込み後のため、この提案はもう選択できません。もう一度相談してみてください)')+'</div>';
      }
      html += '</div></div>';
      return html;
    }
    const kindClass = m.kind==='error' ? ' chat-error' : (m.kind==='dismissed' ? ' chat-muted' : '');
    let html = '<div class="chat-msg chat-coach"><div class="chat-bubble'+kindClass+'">'+escapeHtml(m.text||'');
    if(m.kind==='confirmed' && m.undo){
      html += '<button type="button" class="undo-btn" data-action="undo-adjust" data-msgid="'+m.id+'">元に戻す</button>';
    }
    html += '</div></div>';
    return html;
  }

  function normalizeAdjustedPlan(prevPlan, raw){
    if(!raw || typeof raw!=='object') return null;
    if(!Array.isArray(raw.weeks) || raw.weeks.length===0) return null;
    const weeks = raw.weeks.map((wk,i)=>({
      label: typeof wk.label==='string' ? wk.label : ('Week '+(i+1)),
      phase: typeof wk.phase==='string' ? wk.phase : '',
      dateRange: typeof wk.dateRange==='string' ? wk.dateRange : '',
      items: Array.isArray(wk.items) ? wk.items.map(it=>({
        type: typeof it.type==='string' ? it.type : 'rest',
        day: typeof it.day==='string' ? it.day : '',
        date: (it && typeof it.date==='string') ? it.date : null,
        title: typeof it.title==='string' ? it.title : '',
        desc: typeof it.desc==='string' ? it.desc : '',
        flag: it.flag || null,
        flagText: it.flagText || null,
        peak: !!it.peak
      })) : []
    }));
    const rawMeta = (raw.meta && typeof raw.meta==='object') ? raw.meta : {};
    const meta = Object.assign({}, prevPlan.meta, rawMeta);
    if(!Array.isArray(meta.policy)) meta.policy = prevPlan.meta.policy;
    const extras = (raw.extras && Array.isArray(raw.extras.fueling) && Array.isArray(raw.extras.cautions)) ? raw.extras : prevPlan.extras;
    return { id: prevPlan.id, createdAt: prevPlan.createdAt, meta, weeks, extras, history: prevPlan.history || [] };
  }

  // 直近14日のRPE傾向・痛み申告をコーチ文脈用に要約する(Phase4: コーチの文脈拡張)
  function recentLogSummaryLines(){
    const lines = [];
    const today = todayLocal();
    const windowStart = addDays(today, -14);
    const logs = state.logs || {};
    const rpes = [];
    const painDates = [];
    let loggedCount = 0;
    Object.keys(logs).forEach(function(d){
      const dt = parseISO(d);
      if(!dt || dt<windowStart || dt>today) return;
      const log = logs[d];
      if(!log) return;
      loggedCount++;
      if(log.rpe) rpes.push(Number(log.rpe));
      if(log.pain && log.pain.level>0){
        painDates.push(fmtMD(dt)+'('+(PAIN_LEVEL_LABEL[log.pain.level]||'')+(log.pain.parts&&log.pain.parts.length?'・'+log.pain.parts.join('・'):'')+')');
      }
    });
    if(loggedCount>0){
      let line = '直近14日の記録数: '+loggedCount+'件';
      if(rpes.length) line += '、平均RPE: '+(Math.round(rpes.reduce(function(a,b){return a+b;},0)/rpes.length*10)/10);
      lines.push(line);
    }
    if(painDates.length) lines.push('直近の痛み・違和感の申告: '+painDates.join('、'));
    return lines;
  }

  /* ============================================================
     Coach Service — LLM Providerの抽象化(GitHub移行後、OpenAI API対応で追加)
     UI側(runAdjust/runLogFeedback)は CoachService.request(prompt, opts) だけを呼び、
     どちらのProviderが実際にAIを呼んでいるかを意識しない。
     Provider選択は selectCoachProvider() の1箇所に集約する。
     どちらのProviderも sampleFn.json(prompt, opts) と同じ入出力(prompt文字列 → JSONオブジェクト)を
     守るので、呼び出し側(buildAdjustPrompt/advice-optionsの解釈/applyPlanChange等)は無変更で流用できる。
     画像OCR(extractFromImage、Garminスクリーンショット等の読み取り)は今回のスコープ外とし、
     引き続きClaude Artifactの`sample` capabilityを直接使う(このCoachService経由にはしない)。
  ============================================================ */

  // Claude Artifact上で動いている場合、既存通り window.claude.use('sample') をそのまま使う。
  // ここでの変更は無し(既存のClaude Artifact版の挙動を一切壊さないため)。
  const ClaudeArtifactProvider = {
    name: 'claude-artifact',
    available(){ return !!sampleFn; },
    request(prompt, opts){
      return sampleFn.json(prompt, opts || {});
    }
  };

  // Claude Artifact以外(ローカル起動・Vercel等)で動いている場合に使う。
  // OpenAI APIキーはブラウザ側に一切持たせず、サーバー側の /api/coach 経由でのみ呼び出す。
  const OpenAIProvider = {
    name: 'openai',
    available(){ return true; }, // 実際に呼べるか(OPENAI_API_KEY未設定等)はサーバー側で判定し、失敗時はcoach_unreachable等のエラーとして返る
    async request(prompt, opts){
      opts = opts || {};
      let httpRes;
      try{
        httpRes = await fetch(apiEndpoint('/api/coach'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, modelTier: opts.modelTier || 'default' }),
          signal: opts.signal
        });
      }catch(networkErr){
        if(networkErr && networkErr.name==='AbortError') throw {code:'cancelled'};
        throw {code:'coach_unreachable'};
      }
      if(!httpRes.ok){
        let errCode = 'coach_unreachable';
        try{
          const errBody = await httpRes.json();
          if(errBody && errBody.error==='rate_limited') errCode = 'rate_limited';
        }catch(e){ /* ignore, keep default errCode */ }
        throw {code:errCode};
      }
      let data;
      try{ data = await httpRes.json(); }catch(e){ throw {code:'invalid_json'}; }
      if(!data || typeof data!=='object') throw {code:'invalid_json'};
      return data;
      // 注意: OpenAIProviderは現状ストリーミング非対応(opts.onTextは呼ばれない)。
      // 呼び出し側は onText が呼ばれなくても「考え中…」表示のみになるだけで問題なく動作する(既存の作り)。
    }
  };

  function selectCoachProvider(){
    return ClaudeArtifactProvider.available() ? ClaudeArtifactProvider : OpenAIProvider;
  }

  const CoachService = {
    request(prompt, opts){
      return selectCoachProvider().request(prompt, opts);
    }
  };

  // コーチ(チャット相談・記録後フィードバック共通)にプロンプトとして渡す背景情報。
  // Phase4でPB・シューズ・直近FORECAST・直近ログ傾向を追加(要件: コーチの参照情報拡張)
  function planContextLines(plan){
    const lines = [];
    const profile = state.profile || {};
    // 個人プロフィールは最新の内容を、レース固有のコース情報はプラン作成時の内容を参照する。
    if(profile.injuryNote || plan.meta.injuryNote) lines.push('既往症・怪我パターン: '+(profile.injuryNote || plan.meta.injuryNote));
    if(plan.meta.courseNote) lines.push('コース特性・気候: '+plan.meta.courseNote);
    if(profile.constitutionNote || plan.meta.constitutionNote) lines.push('体質的特徴: '+(profile.constitutionNote || plan.meta.constitutionNote));
    if(profile.scheduleNote || plan.meta.scheduleNote) lines.push('生活制約・走れる曜日: '+(profile.scheduleNote || plan.meta.scheduleNote));
    const pbs = (state.profile && state.profile.pbs) || [];
    if(pbs.length) lines.push('自己ベスト: '+pbs.map(function(pb){ return pb.label+' '+pb.timeLabel; }).join('、'));
    const shoes = (state.profile && state.profile.shoes) || [];
    const activeShoes = shoes.filter(function(s){ return s.active!==false; });
    if(activeShoes.length) lines.push('使用中のシューズ: '+activeShoes.map(function(s){ return s.name+(s.brand?'('+s.brand+')':''); }).join('、'));
    if(profile.weeklyRunDays) lines.push('週に走れる回数: '+profile.weeklyRunDays+'回');
    if(profile.availableWeekdays && profile.availableWeekdays.length) lines.push('走れる曜日: '+profile.availableWeekdays.map(function(d){ return WEEKDAY_JA[Number(d)]; }).join('・'));
    const longest = effectiveLongestRunKm(profile);
    if(longest.km) lines.push('現在の最長ロング走: '+formatKm(longest.km)+'('+longest.source+')');
    const forecast = latestForecastFor(plan.id);
    if(forecast){
      lines.push('直近のRACE FORECAST: 目標'+secToHMSLabel(forecast.recommendedGoalSec)+'(CHALLENGE '+secToHMSLabel(forecast.challengeGoalSec)+'〜SAFE '+secToHMSLabel(forecast.safeGoalSec)+'、確信度: '+(FORECAST_CONFIDENCE_LABEL[forecast.confidence]||forecast.confidence)+')');
    }
    lines.push.apply(lines, recentLogSummaryLines());
    return lines;
  }

  function buildAdjustPrompt(plan, instruction, todayStr, historyLines){
    const payload = {meta:plan.meta, weeks:plan.weeks, extras:plan.extras};
    const context = planContextLines(plan);
    return [
      'あなたは経験豊富なランニングコーチです。以下はランナーの走り込みプラン(JSON)です。ランナーからの相談に対して、判断ロジック(下記「# 判断ルール」)に基づいて対応してください。',
      '今日の日付: '+todayStr,
      context.length ? ('ランナーの背景情報:\n- '+context.join('\n- ')) : '',
      (historyLines && historyLines.length) ? ('# これまでの会話の流れ(直近、参考情報。矛盾する場合は現在のプランと今回の依頼を優先する)\n- '+historyLines.join('\n- ')) : '',

      '  - optionsには、リスクを踏まえた代替案を1〜2個、それぞれ理由付きで提示する(まったく同じプランを2つ出さない。案が1つしか無ければ1個でよい)。',
      '  - 各optionのlabelは「案1: 〜」のように短く、summaryはその案を選ぶ理由・トレードオフを日本語2〜3文で具体的に書く。',
      '  - 各optionのplanは、下記の構造を持つ完全なプランJSON({"meta":{...},"weeks":[...],"extras":{...}})。ユーザーがそのoptionを選んだ場合にそのまま適用されるので、変更が無い部分も含めて完全な形で書くこと。',
      '  - このmodeでは、ユーザーが選ぶまでプランは確定しない。断定的な「これしかない」ではなく、トレードオフを示してユーザーが選べるようにする。',
      '- weeks配列の各要素は {label, phase, dateRange, items:[{type, day, date, title, desc, flag?, flagText?, peak?}]} の形を保つ。',
      '- items[].type は "mp" | "easy" | "long" | "rest" | "preRace" | "race" | "event" のいずれか。event は大会本番以外の出場イベント(ファンランなど)用。',
      '- items[].date は "YYYY-MM-DD" 形式。特定の日付がない項目は null。',
      '- 変更を伴う場合、meta.policyまたはextras.cautions(注意事項)に今回の変更点の要約を1行追記してよい。',
      '',
      '次のJSON「だけ」を返してください。説明文やコードフェンス、前置きは一切不要です。上記のいずれか一方の形式(mode:"advice" または mode:"options")のみを返すこと。'
    ].filter(Boolean).join('\n');
  }

  /* ============================================================
     AIコーチのチャットスレッド管理(Phase7)
     messages配列がそのままチャットの表示内容になる。永続化時は容量の大きい項目
     (options[].plan本体、確定時のundo用プランスナップショット等)を間引く
  ============================================================ */
  function genMsgId(){ return 'msg'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // 直近の会話をAIへの参考文脈として簡潔な行の配列にする(フォローアップの相談に対応するため)
  function recentCoachHistoryLines(messages){
    return (messages||[]).slice(-10).map(function(m){
      if(m.role==='user') return 'ランナー: '+m.text;
      if(m.kind==='advice') return 'コーチ: '+m.text;
      if(m.kind==='confirmed') return 'コーチ: (プランに反映済み)'+m.text;
      if(m.kind==='dismissed') return 'コーチ: '+m.text;
      if(m.kind==='error') return null;
      if(m.kind==='options'){
        let s = 'コーチ: (変更案を提示。リスク: '+(m.risk||'特になし')+'。候補: '+(m.options||[]).map(function(o){ return o.label+'='+o.summary; }).join(' / ')+')';
        if(m.chosenLabel) s += ' → ランナーは「'+m.chosenLabel+'」を選択した。';
        else if(m.resolved) s += ' → ランナーはこの提案を見送った。';
        return s;
      }
      return null;
    }).filter(Boolean);
  }

  // 永続化用にメッセージを軽量化する。優先セッション限定の情報(選択肢のplan本体・
  // 選択前提のprevPlan/prevCompleted・undo用スナップショット)はここで落とす
  function stripMessageForStorage(m){
    if(m.role==='coach' && m.kind==='options'){
      return {
        id:m.id, role:m.role, kind:m.kind, ts:m.ts, risk:m.risk||null,
        options:(m.options||[]).map(function(o){ return {id:o.id, label:o.label, summary:o.summary}; }),
        resolved: !!m.resolved, chosenOptionId: m.chosenOptionId||null, chosenLabel: m.chosenLabel||null
      };
    }
    if(m.role==='coach' && m.kind==='confirmed'){
      return { id:m.id, role:m.role, kind:m.kind, ts:m.ts, text:m.text };
    }
    return m;
  }

  function persistCoachLog(){
    const plan = currentPlan();
    if(!plan) return;
    const toSave = state.coach.messages.map(stripMessageForStorage);
    Store.setCoachLog(plan.id, toSave);
  }

  function addCoachMessage(msg){
    msg.id = msg.id || genMsgId();
    msg.ts = msg.ts || Date.now();
    state.coach.messages.push(msg);
    if(state.coach.messages.length>30) state.coach.messages = state.coach.messages.slice(-30);
    persistCoachLog();
    return msg;
  }

  function loadCoachThread(planId){
    if(!planId || state.coach.loadedFor===planId || state.coach.loading) return;
    state.coach.loading = true;
    render();
    Store.getCoachLog(planId).then(function(messages){
      if(state.currentId!==planId){ state.coach.loading = false; return; }
      state.coach.messages = messages || [];
      state.coach.loadedFor = planId;
      state.coach.loading = false;
      render();
    }).catch(function(){
      state.coach.messages = [];
      state.coach.loadedFor = planId;
      state.coach.loading = false;
      render();
    });
  }

  function adjustErrorMessage(code){
    switch(code){
      case 'rate_limited': return 'しばらく時間をおいて、もう一度お試しください';
      case 'invalid_json': return 'コーチの応答を読み取れませんでした。もう一度お試しください';
      case 'refused': return 'この内容には対応できませんでした。別の言い方でお試しください';
      case 'prompt_too_large': return 'プランが大きすぎて調整できませんでした';
      case 'empty_completion': return '応答が得られませんでした。もう一度お試しください';
      case 'session_expired': return 'サインインの有効期限が切れました。再読み込みしてお試しください';
      case 'coach_unreachable': return 'コーチとの通信に失敗しました。少し時間を置いてもう一度お試しください';
      default: return '調整に失敗しました。もう一度お試しください';
    }
  }

  // 注意: 対象プランの特定は必ずprevPlan.id(=会話・記録が発生した時点でのプランのid。
  // updatedPlan.idはnormalizeAdjustedPlanによって常にこれと同じ値に揃えられる)を使うこと。
  // 「今選択中のプラン」(currentPlan())は、AIの応答を待つ間にユーザーが別のプランへ
  // 切り替えている可能性があり、それを使うと変更が意図しないプランに適用されてしまうため使わない
  async function applyPlanChange(prevPlan, prevCompleted, normalizedPrev, updatedPlan, reason, summary){
    const targetId = prevPlan.id;
    const changed = JSON.stringify(updatedPlan.weeks)!==JSON.stringify(normalizedPrev.weeks) || JSON.stringify(updatedPlan.meta)!==JSON.stringify(normalizedPrev.meta);
    if(changed){
      const hist = (prevPlan.history || []).concat([{ ts: Date.now(), reason: reason||null, summary: summary||null }]).slice(-30);
      updatedPlan.history = hist;
    } else {
      updatedPlan.history = prevPlan.history || [];
    }
    await Store.savePlan(updatedPlan);
    const idx = state.plans.findIndex(p=>p.id===targetId);
    if(idx>=0) state.plans[idx] = updatedPlan;
    let nextCompleted = prevCompleted;
    if(changed){
      nextCompleted = resetCompletedForChangedWeeks(normalizedPrev.weeks, updatedPlan.weeks, prevCompleted);
      await Store.setProgress(targetId, nextCompleted);
      if(state.currentId===targetId) state.completed = nextCompleted;
    }
    return { changed: changed, undo: changed ? { planId: targetId, prevPlan: prevPlan, prevCompleted: prevCompleted } : null };
  }

  let adjustTimer = null;
  let adjustController = null;
  // sample呼び出し(リトライ込み)が長引きすぎて「考え中」のまま返ってこなくなることを防ぐための上限
  const ADJUST_TIMEOUT_MS = 170000;
  // raceWithDeadline()が仕込むsetTimeoutは、スマホでタブが長時間バックグラウンドに置かれた場合などに
  // ブラウザ側の都合で発火が遅延・欠落することが稀にある(実機で494秒経っても打ち切られなかった報告あり)。
  // そのバックアップとして、現在アクティブなraceWithDeadline呼び出しのreject関数をここに保持しておき、
  // 秒数表示のticker(setInterval、毎秒実行)側からも締め切りを過ぎていないか直接チェックする。
  // setTimeoutが正常に発火していれば通常はこちらが呼ばれる前にPromiseは解決済みなので何もしない
  let currentAdjustReject = null;

  function adjustElapsedLabel(elapsed){
    return '考え中…'+elapsed+'秒(通常30秒〜2分ほど。それ以上かかる場合は自動的に打ち切ります)';
  }

  // 体感速度の改善: sample.jsonはJSON全体が確定するまで待たないと使えないが、
  // onTextでは生成途中の生JSONテキストがストリーミングで届く。そこから
  // "summary"(相談モード)または"risk"(プラン変更モード、先頭に来ることが多い)の
  // 値部分だけを正規表現で緩く抜き出し、まだ完成していない「考え中」の間にも
  // それらしい文章が少しずつ見えてくるプレビューとして表示する(体感の待ち時間短縮が目的で、
  // 厳密なJSONパースは行わない。値が見つからない間は今まで通りの「考え中…」表示のみ)
  function extractAdjustStreamPreview(raw){
    if(!raw) return null;
    const m = raw.match(/"(?:summary|risk)"\s*:\s*"((?:\\.|[^"\\])*)/);
    if(!m) return null;
    const s = m[1].replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"').replace(/\\\\/g,'\\');
    return s.trim() ? s : null;
  }
  function resetAdjustStreamPreview(){
    state.adjust.streamPreview = null;
    const el = document.getElementById('adjust-stream-preview');
    if(el){ el.textContent = ''; el.hidden = true; }
  }
  function handleAdjustStreamText(update){
    const preview = extractAdjustStreamPreview(update && update.text);
    state.adjust.streamPreview = preview;
    // tickerの秒数更新と同様、フルre-renderせず該当要素だけを直接更新する(頻度が高いため)
    const el = document.getElementById('adjust-stream-preview');
    if(el){
      el.textContent = preview || '';
      el.hidden = !preview;
    }
  }

  function startAdjustTicker(deadline){
    stopAdjustTicker();
    adjustTimer = setInterval(function(){
      if(!state.adjust.busy) return;
      // 毎秒フルre-render(innerHTML全体の再構築)すると、モバイル環境で描画の反映が
      // 遅延・スキップされ「秒数が進まない」ように見えることがあるため、
      // 表示中の経過秒数テキストだけを直接軽量更新する。要素が無ければ何もしない(無理にrenderしない)
      const el = document.getElementById('adjust-elapsed-txt');
      if(el){
        const elapsed = state.adjust.startedAt ? Math.max(0, Math.floor((Date.now()-state.adjust.startedAt)/1000)) : 0;
        el.textContent = adjustElapsedLabel(elapsed);
      }
      // バックアップの締め切りチェック(上記コメント参照)。setTimeoutが遅延・欠落していても、
      // このtickerが動く限り(=タブがアクティブに戻った時点で)確実に打ち切れる
      if(deadline && Date.now()>=deadline && currentAdjustReject){
        const rej = currentAdjustReject;
        currentAdjustReject = null;
        rej({code:'timeout'});
      }
    }, 1000);
  }
  function stopAdjustTicker(){
    if(adjustTimer){ clearInterval(adjustTimer); adjustTimer = null; }
  }

  async function runAdjust(instruction){
    const plan = currentPlan();
    if(!plan) return;
    const prevPlan = JSON.parse(JSON.stringify(plan));
    const prevCompleted = JSON.parse(JSON.stringify(state.completed));
    const normalizedPrev = normalizeAdjustedPlan(plan, {meta:prevPlan.meta, weeks:prevPlan.weeks, extras:prevPlan.extras});
    // 直前に追加したランナーの発言(=今回のinstruction)を除いた、それより前のやりとりだけを文脈として渡す
    const historyLines = recentCoachHistoryLines(state.coach.messages.slice(0, -1));
    const prompt = buildAdjustPrompt(plan, instruction, todayISO(), historyLines);
    adjustController = new AbortController();
    const deadline = Date.now() + ADJUST_TIMEOUT_MS;
    let pendingDeadlineTimers = [];
    // abort()を呼んでもsample側の呼び出しが実際には解決/拒否されないケース(プラットフォーム側の挙動に
    // よっては起こりうる)があっても「考え中」から永久に戻れなくならないよう、abort()の効果を待たずに
    // 独立したタイマーとPromise.raceさせることで、こちら側の判断だけで確実に諦められるようにする
    function raceWithDeadline(promise){
      return Promise.race([
        promise,
        new Promise(function(_, reject){
          // tickerからのバックアップ用に、この呼び出しのreject関数を外に保持しておく
          currentAdjustReject = reject;
          const ms = Math.max(0, deadline - Date.now());
          const id = setTimeout(function(){
            if(currentAdjustReject===reject) currentAdjustReject = null;
            reject({code:'timeout'});
          }, ms);
          pendingDeadlineTimers.push(id);
        })
      ]);
    }
    startAdjustTicker(deadline);
    try{
      // JSON整形の一時的な失敗はまれに起きるため、1回だけ静かにリトライしてから諦める
      let result;
      resetAdjustStreamPreview();
      try{
        result = await raceWithDeadline(CoachService.request(prompt, {modelTier:'complex', cache:false, signal:adjustController.signal, onText:handleAdjustStreamText}));
        if(!result || typeof result!=='object') throw {code:'invalid_json'};
      }catch(firstErr){
        if(firstErr && firstErr.code==='timeout') throw firstErr;
        const retryableCode = firstErr && (firstErr.code==='invalid_json' || firstErr.code==='empty_completion');
        if(!retryableCode) throw firstErr;
        // リトライ時は前回の(失敗した)プレビューを引きずらないよう一旦クリアする
        resetAdjustStreamPreview();
        result = await raceWithDeadline(CoachService.request(prompt, {modelTier:'complex', cache:false, signal:adjustController.signal, onText:handleAdjustStreamText}));
        if(!result || typeof result!=='object') throw {code:'invalid_json'};
      }

      let rawOptions = null;
      if(result.mode==='options' && Array.isArray(result.options) && result.options.length){
        rawOptions = result.options;
      } else if(!result.mode && Array.isArray(result.options) && result.options.length){
        rawOptions = result.options;
      } else if(!result.mode && result.plan){
        // backward-compatible fallback: treat a single bare plan as one option
        rawOptions = [{ label:'提案', summary: (typeof result.summary==='string'?result.summary:'プランを調整しました'), plan: result.plan }];
      }

      if(rawOptions){
        const options = rawOptions.map(function(opt, i){
          const normalized = normalizeAdjustedPlan(plan, opt && opt.plan);
          if(!normalized) return null;
          return {
            id: 'opt'+i,
            label: (opt && typeof opt.label==='string') ? opt.label : ('案'+(i+1)),
            summary: (opt && typeof opt.summary==='string') ? opt.summary : '',
            plan: normalized
          };
        }).filter(Boolean);
        if(!options.length) throw {code:'invalid_json'};
        state.adjust.busy = false;
        state.adjust.error = null;
        addCoachMessage({
          role:'coach', kind:'options',
          risk: (typeof result.risk==='string') ? result.risk : '',
          options: options,
          resolved:false, chosenOptionId:null, chosenLabel:null,
          instruction: instruction, prevPlan: prevPlan, prevCompleted: prevCompleted, normalizedPrev: normalizedPrev
        });
        render();
        return;
      }

      // advice-only: no schedule change
      state.adjust.busy = false;
      state.adjust.error = null;
      addCoachMessage({ role:'coach', kind:'advice', text: (result && typeof result.summary==='string') ? result.summary : '今のプランのままで大丈夫です' });
      render();
    }catch(e){
      state.adjust.busy = false;
      const code = e && e.code;
      if(code==='not_granted' || code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed'){
        state.adjust.hidden = true;
      } else if(code==='timeout'){
        // こちら側のタイマーが先に切れたケース。sample呼び出しが後から解決する可能性はあるが、
        // 結果は使わずここで諦める(念のためabortも送っておく。効かなくても実害はない)
        if(adjustController){ try{ adjustController.abort(); }catch(e2){} }
        addCoachMessage({ role:'coach', kind:'error', text:'応答に時間がかかりすぎたため中断しました。もう一度お試しください' });
      } else if(code==='cancelled'){
        // ユーザー自身がキャンセルした場合は何も表示しない(従来通り)
      } else {
        const msg = adjustErrorMessage(code);
        addCoachMessage({ role:'coach', kind:'error', text: msg });
      }
      render();
    } finally {
      pendingDeadlineTimers.forEach(function(id){ clearTimeout(id); });
      stopAdjustTicker();
      adjustController = null;
      currentAdjustReject = null;
      state.adjust.streamPreview = null;
    }
  }

  async function chooseAdjustOption(messageId, optionId){
    const msg = state.coach.messages.find(function(m){ return m.id===messageId; });
    if(!msg || msg.kind!=='options' || msg.resolved || !msg.prevPlan) return;
    const chosen = (msg.options||[]).find(function(o){ return o.id===optionId && o.plan; });
    if(!chosen) return;
    // 対象プランはmsg.prevPlan(=この提案が作られた時点のプラン)に固定する。
    // ここでcurrentPlan()を使うと、応答を待つ間にユーザーが別のプランへ切り替えていた場合に
    // 意図しないプランへ変更が適用されてしまう
    const result = await applyPlanChange(msg.prevPlan, msg.prevCompleted, msg.normalizedPrev, chosen.plan, msg.instruction, chosen.summary);
    msg.resolved = true;
    msg.chosenOptionId = chosen.id;
    msg.chosenLabel = chosen.label;
    addCoachMessage({ role:'coach', kind:'confirmed', text: (chosen.summary || 'プランを調整しました')+(result.changed?'\nチェック状況はリセットされました。':''), undo: result.undo });
    render();
  }

  function dismissAdjustOptions(messageId){
    const msg = state.coach.messages.find(function(m){ return m.id===messageId; });
    if(!msg || msg.kind!=='options' || msg.resolved) return;
    msg.resolved = true;
    addCoachMessage({ role:'coach', kind:'dismissed', text:'承知しました。今回はこのままにしておきますね。また気になることがあればいつでも相談してください。' });
    render();
  }

  /* ============================================================
     workout logging + AI feedback
  ============================================================ */
  function buildLogInstruction(item, log){
    const lines = [];
    lines.push('以下はランナーが実施した練習の実績記録です。プラン内容と比較し、コーチとして評価・フィードバックしてください。');
    lines.push('');
    lines.push('対象日: '+item.date+'('+item.day+') '+item.title);
    lines.push('プラン内容: '+(item.desc||'(詳細なし)'));
    const actual = [];
    if(log.distanceKm) actual.push('距離 '+log.distanceKm+'km');
    if(log.avgPace) actual.push('平均ペース '+log.avgPace+'/km');
    if(log.avgHr) actual.push('平均心拍 '+log.avgHr+'bpm');
    if(log.durationMin) actual.push('時間 '+log.durationMin+'分');
    if(log.calories) actual.push(log.calories+'kcal');
    if(log.fuelingNote) actual.push('補給: '+log.fuelingNote);
    lines.push('実績: '+(actual.join('、')||'(数値の記録なし)'));
    if(log.note) lines.push('ランナーのメモ: '+log.note);
    lines.push('');
    lines.push('# 対応方針');
    lines.push('- summaryに、この1回の実績についての短いフィードバック(日本語2〜3文)を書く。ペース・心拍・補給のバランスや、プラン通りにできていたかに触れる。');
    lines.push('- 実績が計画より大幅にきつかった/楽だった、または違和感・不調のメモがある場合のみ、今後(今日より後の日付)のメニューを調整してよい。問題なければプランは変更しなくてよい。');
    lines.push('- 変更する場合も直近1〜2週間の範囲に留め、レース日・目標タイムは変えない。');
    return lines.join('\n');
  }

  async function runLogFeedback(item, log){
    // 以前は「Claude Artifactのsample capabilityが無ければ即終了」だったが、
    // OpenAIProvider経由でも記録後フィードバックを提供できるようにしたためこのガードは撤去した。
    // 呼べるProviderが実際に無い/失敗する場合はcatch節でfeedbackText=nullとなり、既存通り静かに諦める
    const plan = currentPlan();
    if(!plan) return;
    const prevPlan = JSON.parse(JSON.stringify(plan));
    const prevCompleted = JSON.parse(JSON.stringify(state.completed));
    const normalizedPrev = normalizeAdjustedPlan(plan, {meta:prevPlan.meta, weeks:prevPlan.weeks, extras:prevPlan.extras});
    state.logForm.feedbackBusy = item.date;
    render();
    let feedbackText = null;
    try{
      const instruction = buildLogInstruction(item, log);
      const prompt = buildAdjustPrompt(plan, instruction, todayISO());
      const result = await CoachService.request(prompt, {modelTier:'default', cache:false});
      if(!result || typeof result!=='object') throw {code:'invalid_json'};

      let rawOptions = null;
      if(result.mode==='options' && Array.isArray(result.options) && result.options.length) rawOptions = result.options;
      else if(!result.mode && result.plan) rawOptions = [{ label:'提案', summary:(typeof result.summary==='string'?result.summary:'メニューを調整しました'), plan:result.plan }];

      if(rawOptions){
        const options = rawOptions.map(function(opt, i){
          const normalized = normalizeAdjustedPlan(plan, opt && opt.plan);
          if(!normalized) return null;
          return { id:'opt'+i, label:(opt&&typeof opt.label==='string')?opt.label:('案'+(i+1)), summary:(opt&&typeof opt.summary==='string')?opt.summary:'', plan:normalized };
        }).filter(Boolean);
        if(options.length){
          state.logProposal = { forDate: item.date, risk:(typeof result.risk==='string')?result.risk:'', options: options, instruction: instruction, prevPlan: prevPlan, prevCompleted: prevCompleted, normalizedPrev: normalizedPrev };
          feedbackText = (typeof result.risk==='string' && result.risk) ? result.risk : '実績をもとに、今後のメニュー調整案を用意しました。';
        }
      }
      if(!feedbackText){
        feedbackText = (result && typeof result.summary==='string') ? result.summary : '記録ありがとうございます。';
      }
    }catch(e){
      feedbackText = null;
    } finally {
      const entries = Object.assign({}, state.logs);
      if(entries[item.date]) entries[item.date] = Object.assign({}, entries[item.date], { feedback: feedbackText });
      state.logs = entries;
      if(currentPlan()) Store.setLogs(currentPlan().id, entries);
      state.logForm.feedbackBusy = null;
      render();
    }
  }

  async function applyLogProposal(idx){
    const p = state.logProposal;
    if(!p || !p.options[idx] || !p.prevPlan) return;
    const chosen = p.options[idx];
    const reason = fmtMD(parseISO(p.forDate))+'の実績記録に基づく提案';
    // 対象プランはp.prevPlan(=この提案が作られた時点のプラン)に固定する。
    // なお現状はプラン切替時にstate.logProposalが破棄される(select-plan/delete-planハンドラ参照)ため
    // ここに来る時点でcurrentPlan()と食い違うことは無いはずだが、applyPlanChange側の契約に合わせて統一しておく
    const result = await applyPlanChange(p.prevPlan, p.prevCompleted, p.normalizedPrev, chosen.plan, reason, chosen.summary);
    if(result.undo) state.logUndo = Object.assign({}, result.undo, { forDate: p.forDate });
    const entries = Object.assign({}, state.logs);
    if(entries[p.forDate]) entries[p.forDate] = Object.assign({}, entries[p.forDate], { feedback: chosen.summary });
    state.logs = entries;
    if(currentPlan()) Store.setLogs(currentPlan().id, entries);
    state.logProposal = null;
    render();
  }

  async function saveLog(dateStr, values){
    const plan = currentPlan();
    if(!plan) return;
    const found = findItemByDate(plan, dateStr);
    const entries = Object.assign({}, state.logs);
    const prevFeedback = entries[dateStr] && entries[dateStr].feedback;
    const imageImport = state.logForm.imageImport || (entries[dateStr] && entries[dateStr].imageImport) || null;
    const painLevelNum = values.painLevel ? Number(values.painLevel) : 0;
    const painParts = values.painParts || [];
    const pain = (painLevelNum>0 || painParts.length) ? { level: painLevelNum, parts: painParts } : null;
    entries[dateStr] = {
      distanceKm: values.distanceKm ? Number(values.distanceKm) : null,
      avgPace: values.avgPace || null,
      avgHr: values.avgHr ? Number(values.avgHr) : null,
      durationMin: values.durationMin ? Number(values.durationMin) : null,
      calories: values.calories ? Number(values.calories) : null,
      fuelingNote: values.fuelingNote || null,
      note: values.note || null,
      shoeId: values.shoeId || null,
      rpe: values.rpe ? Number(values.rpe) : null,
      pain: pain,
      completionType: values.completionType || null,
      source: imageImport ? 'screenshot' : 'manual',
      // 元画像は保存せず、読み取れた構造化データだけを通常の走行実績に残す。
      imageImport: imageImport,
      feedback: prevFeedback || null,
      loggedAt: new Date().toISOString()
    };
    state.logs = entries;
    const keepFeedbackBusy = state.logForm.feedbackBusy;
    state.logForm = { openDate:null, values:null, busy:false, error:null, imageBusy:false, imageError:null, imageImport:null, feedbackBusy: keepFeedbackBusy };
    await Store.setLogs(plan.id, entries);
    // 予定日別ログは従来互換のまま維持し、同じ実績を共通Workoutにも保存する。
    // HealthKit / Health Connect / Strava等の取り込みは以後この入口へ流し込む。
    await upsertWorkout(workoutFromLog(plan, dateStr, entries[dateStr]));
    render();
    if(found) runLogFeedback(found.it, entries[dateStr]);
    recomputeAndSaveForecast(plan).then(function(){ render(); });
  }

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function imageElementFromFile(file){
    return new Promise(function(resolve, reject){
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = function(){ URL.revokeObjectURL(url); resolve(image); };
      image.onerror = function(){ URL.revokeObjectURL(url); reject({code:'invalid_image'}); };
      image.src = url;
    });
  }

  async function compactImageForExtraction(file){
    if(!file || !/^image\/(jpeg|png|webp)$/i.test(file.type||'')) throw {code:'invalid_image'};
    // iPhoneの高解像度スクリーンショットもVercelのリクエスト上限内に収める。
    const image = await imageElementFromFile(file);
    let width = image.naturalWidth || image.width, height = image.naturalHeight || image.height;
    const maxSide = 2048;
    if(Math.max(width,height)>maxSide){ const ratio=maxSide/Math.max(width,height); width=Math.round(width*ratio); height=Math.round(height*ratio); }
    for(let attempt=0; attempt<4; attempt++){
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(image,0,0,width,height);
      const blob = await new Promise(function(resolve){ canvas.toBlob(resolve,'image/jpeg',0.86); });
      if(!blob) throw {code:'invalid_image'};
      if(blob.size<=3*1024*1024) return readFileAsDataUrl(blob);
      width=Math.round(width*0.72); height=Math.round(height*0.72);
    }
    throw {code:'image_too_large'};
  }

  async function extractFromWebApi(file){
    const imageDataUrl = await compactImageForExtraction(file);
    let response;
    try{
      response = await fetch(apiEndpoint('/api/run-extract'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({imageDataUrl:imageDataUrl}) });
    }catch(e){ throw {code:'extract_unavailable'}; }
    let body={}; try{ body=await response.json(); }catch(e){}
    if(!response.ok) throw {code:(body&&body.error)||'extract_unavailable'};
    return body;
  }

        sourceApp: result.sourceApp || null,
        confidence: result.confidence && typeof result.confidence==='object' ? result.confidence : {}
      };
    }catch(e){
      const code = e && e.code;
      if(code==='image_rejected') state.logForm.imageError = '画像を読み取れませんでした。別の画像でお試しください';
      else if(code==='images_unavailable') state.logForm.imageError = '画像からの読み取りは利用できません';
      else if(code==='image_too_large') state.logForm.imageError = '画像が大きすぎます。別の画像でお試しください';
      else if(code==='invalid_image') state.logForm.imageError = 'JPEG、PNG、WebP形式の画像を選択してください';

  }

    } else if(action==='toggle-shoe-add'){
      state.shoeFormOpen = !state.shoeFormOpen;
      render();
    } else if(action==='toggle-training-edit'){
      state.trainingEditOpen = !state.trainingEditOpen;
      render();
    } else if(action==='pace-calc-mode'){
      state.paceCalc.mode = btn.dataset.mode;
      render();
    }
  });

  document.getElementById('app').addEventListener('input', function(e){
    if(e.target.id==='adjust-input'){
      // 入力に応じて自然に伸びる。送信前にrenderしても文面を失わないよう下書きも保持する。
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 120)+'px';
      state.adjust.draft = e.target.value;
      return;
    }
    if(e.target.id==='f_name'){
      const form = e.target.closest('#gen-form');
      if(!form) return;
      const match = RACE_PRESETS.find(r=>r.name===e.target.value.trim());
      if(match){ form.distance.value = String(match.distanceKm); refreshTargetPacePreview(form); }
    }
  });

  document.getElementById('app').addEventListener('change', function(e){
    if(e.target.dataset && e.target.dataset.action==='health-auto'){
      const current=state.profile.healthConnections||{};
      state.profile.healthConnections=Object.assign({},current,{autoImport:e.target.checked});
      Store.setProfile(state.profile);
      showMypageToast(e.target.checked?'新しいランを自動登録します':'新しいランは確認してから登録します');
      return;
    }
    if(e.target.id==='f_linkedFrom'){
      const form = e.target.closest('#gen-form');
      if(!form) return;
      const prevPlan = state.plans.find(p=>p.id===e.target.value);
      if(!prevPlan) return;
      const rec = recoveryPlanFor(prevPlan);
      form.startDate.value = toISO(rec.startDate);
      form.longRunStart.value = String(rec.longRunStart);
    }
    if(e.target.matches('select[name="targetH"], select[name="targetM"], select[name="targetS"], select[name="distance"]')){
      const form = e.target.closest('#gen-form');
      if(form) refreshTargetPacePreview(form);
    }
    if(e.target.closest('#pace-sim-form')){
      const form = e.target.closest('#pace-sim-form');
      state.paceSim = {
        distanceKm: parseFloat(form.distanceKm.value),
        h: parseInt(form.simH.value,10)||0,
        m: parseInt(form.simM.value,10)||0,
        s: parseInt(form.simS.value,10)||0
      };
      render();
    }
    if(e.target.closest('#pace-calc-form')){
      const form = e.target.closest('#pace-calc-form');
      state.paceCalc.distanceKm = parseFloat(form.distanceKm.value);
      if(state.paceCalc.mode==='time2pace'){
        state.paceCalc.h = parseInt(form.pcH.value,10)||0;
        state.paceCalc.m = parseInt(form.pcM.value,10)||0;
        state.paceCalc.s = parseInt(form.pcS.value,10)||0;
      } else {
        state.paceCalc.paceM = parseInt(form.pcPaceM.value,10)||0;
        state.paceCalc.paceS = parseInt(form.pcPaceS.value,10)||0;
      }
      render();
    }
  });

  document.getElementById('app').addEventListener('change', function(e){
    if(e.target.matches('[data-action="toggle"]')){
      const key = e.target.dataset.key;
      state.completed[key] = e.target.checked;
      render();
      Store.setProgress(state.currentId, state.completed);
      return;
    }
    if(e.target.matches('[data-action="log-image"]')){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const form = e.target.closest('.log-form');
      if(form){
        state.logForm.values = readLogFormValues(form);
      }
      extractFromImage(file, e.target.dataset.date);
    }
  });

  document.getElementById('app').addEventListener('submit', function(e){
    if(e.target.id==='pace-sim-form'){
      e.preventDefault();
      return;
    }
    if(e.target.id==='pace-calc-form'){
      e.preventDefault();
      return;
    }
    if(e.target.id==='adjust-form'){
      e.preventDefault();
      const ta = document.getElementById('adjust-input');
      const instruction = ta ? ta.value.trim() : '';
      if(!instruction || state.adjust.busy) return;
      state.adjust.draft = '';
      state.adjust.busy = true;
      state.adjust.error = null;
      state.adjust.startedAt = Date.now();
      state.adjust.streamPreview = null;
      addCoachMessage({ role:'user', text: instruction });
      render();
      runAdjust(instruction);
      return;
    }
    if(e.target.classList && e.target.classList.contains('log-form')){
      e.preventDefault();
      const f = e.target;
      const dateStr = f.dataset.date;
      const values = readLogFormValues(f);
      if(!values.distanceKm && !values.avgPace && !values.durationMin){
        state.logForm.error = '距離・ペース・時間のいずれかは入力してください';
        render();
        return;
      }
      state.logForm.error = null;
      saveLog(dateStr, values);
      return;
    }
    if(e.target.id==='profile-form'){
      e.preventDefault();
      const f = e.target;
      state.profile.name = f.name.value.trim() || null;
      Store.setProfile(state.profile);
      state.profileEditOpen = false;
      showMypageToast('プロフィールを保存しました');
      render();
      return;
    }
    if(e.target.id==='training-settings-form'){
      e.preventDefault();
      const f = e.target;
      const weekly = f.weeklyRunDays.value;
      const weeklyCount = weekly ? parseInt(weekly,10) : null;
      const availableWeekdays = Array.from(f.querySelectorAll('input[name="availableWeekdays"]:checked')).map(function(el){ return el.value; });
      if(!weeklyCount || availableWeekdays.length!==weeklyCount){
        showMypageToast('週の回数と、選択した曜日の数を一致させてください');
        return;
      }
      state.profile.weeklyRunDays = weeklyCount;
      state.profile.availableWeekdays = availableWeekdays;
      state.profile.longestRunManualKm = f.longestRunManualKm.value ? Number(f.longestRunManualKm.value) : null;
      state.profile.injuryNote = f.injuryNote.value.trim() || null;
      state.profile.constitutionNote = f.constitutionNote.value.trim() || null;
      state.profile.scheduleNote = f.scheduleNote.value.trim() || null;
      Store.setProfile(state.profile);
      state.trainingEditOpen = false;
      showMypageToast('トレーニング設定を保存しました');
      render();
      return;
    }
    if(e.target.id==='pb-form'){
      e.preventDefault();
      const f = e.target;
      const km = parseFloat(f.distanceKm.value);
      const h = parseInt(f.pbnewH.value,10)||0, m = parseInt(f.pbnewM.value,10)||0, s = parseInt(f.pbnewS.value,10)||0;
      const sec = h*3600+m*60+s;
      if(sec<=0) return;
      const distMeta = PB_DISTANCES.find(d=>d.km===km) || {label: km+'km'};
      state.profile.pbs = (state.profile.pbs||[]).concat([{ id: genId('pb'), distanceKm: km, label: distMeta.label, timeSec: sec, timeLabel: secToHMSLabel(sec) }]);
      Store.setProfile(state.profile);
      render();
      return;
    }
    if(e.target.id==='shoe-form'){
      e.preventDefault();
      const f = e.target;
      const name = f.name.value.trim();
      if(!name) return;
      state.profile.shoes = (state.profile.shoes||[]).concat([{ id: genId('shoe'), name: name, brand: f.brand.value.trim() || null, startDate: (f.startDate && f.startDate.value) || todayISO(), active: true, note: null }]);
      Store.setProfile(state.profile);
      f.reset();
      state.shoeFormOpen = false;
      render();
      refreshShoeMileage();
      return;
    }
    if(e.target.classList && e.target.classList.contains('shoe-edit-form')){
      e.preventDefault();
      const f = e.target;
      const id = f.dataset.id;
      const idx = (state.profile.shoes||[]).findIndex(function(s){ return s.id===id; });
      if(idx>=0){
        state.profile.shoes[idx] = Object.assign({}, state.profile.shoes[idx], {
          brand: f.brand.value.trim() || null,
          startDate: f.startDate.value || null,
          note: f.note.value.trim() || null,
          active: !!f.active.checked
        });
        Store.setProfile(state.profile);
      }
      state.shoeEditId = null;
      render();
      return;
    }
    if(e.target.id!=='gen-form') return;
    e.preventDefault();
    const f = e.target;
    const data = {
      name: f.name.value.trim() || '新しいレース',
      distanceKm: parseFloat(f.distance.value),
      raceDate: f.raceDate.value,
      startDate: f.startDate.value,
      targetH: parseInt(f.targetH.value,10)||0,
      targetM: parseInt(f.targetM.value,10)||0,
      targetS: parseInt(f.targetS.value,10)||0,
      courseNote: f.courseNote.value.trim(),
      linkedFrom: f.linkedFrom ? f.linkedFrom.value : ''
    };
    const errs = {};
    if(!data.raceDate) errs.raceDate = 'レース日を入力してください';
    if(!data.startDate) errs.startDate = '開始日を入力してください';
    const targetSec = data.targetH*3600 + data.targetM*60 + data.targetS;
    if(!targetSec) errs.target = '目標タイムを入力してください';
    if(data.raceDate && data.startDate && new Date(data.startDate) >= new Date(data.raceDate)) errs.startDate = 'レース日より前の日付にしてください';
    if(!profileTrainingReady(state.profile)) errs.profile = 'プラン作成前に、マイページでトレーニング設定を完了してください';

    if(Object.keys(errs).length){ state.formError = errs; render(); return; }

    const profile = state.profile;
    const longest = effectiveLongestRunKm(profile);
    const pattern = trainingWeekPattern(profile.availableWeekdays, Number(profile.weeklyRunDays));
    const bestPb = bestPbForDistance(data.distanceKm, profile.pbs);
    const distLabels = {'42.195':'フルマラソン','21.0975':'ハーフマラソン','16':'16km','10':'10km','5':'5km'};
    const linkedPlan = data.linkedFrom ? state.plans.find(p=>p.id===data.linkedFrom) : null;
    const forceRecoveryWeeks = linkedPlan ? recoveryPlanFor(linkedPlan).forceRecoveryWeeks : null;
    const plan = generatePlan({
      name: data.name,
      distanceLabel: distLabels[f.distance.value] || (data.distanceKm+'km'),
      distanceKm: data.distanceKm,
      raceDate: parseISO(data.raceDate),
      startDate: parseISO(data.startDate),
      targetSec: targetSec,
      targetLabel: secToHMSLabel(targetSec),
      longRunStart: longest.km,
      pbLabel: bestPb ? bestPb.timeLabel : null,
      heelCaution: !!profile.injuryNote,
      injuryNote: profile.injuryNote || null,
      courseNote: data.courseNote || null,
      constitutionNote: profile.constitutionNote || null,
      scheduleNote: profile.scheduleNote || null,
      mpWeekday: pattern.mpWeekday,
      easyWeekdays: pattern.easyWeekdays,
      longWeekday: pattern.longWeekday,
      linkedFromPlanId: linkedPlan ? linkedPlan.id : null,
      forceRecoveryWeeks: forceRecoveryWeeks
    });

    Store.savePlan(plan).then(()=>{
      state.plans.push(plan);
      state.currentId = plan.id;
      state.completed = {};
      state.logs = {};
      state.logForm = { openDate:null, values:null, busy:false, error:null, imageBusy:false, imageError:null, imageImport:null, feedbackBusy:null };
      state.logUndo = null;
      state.logProposal = null;
      state.calendarSelected = null;
      state.mode = 'view';
      state.formError = {};
      render();
      recomputeAndSaveForecast(plan).then(function(){ render(); });
    });
  });

  // タブがバックグラウンドになるとsetIntervalが間引かれ、「考え中…」の秒数表示が
  // 更新されなくなることがあるため、フォアグラウンドに戻った瞬間に即座に再描画して追いつかせる
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && state.adjust.busy) render();
  });

  /* ============================================================
     boot
  ============================================================ */
  async function boot(){
    try{
      db = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('db') : null;
    }catch(e){ db = null; }
    try{
      sampleFn = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('sample') : null;
    }catch(e){ sampleFn = null; }
    // Claude Artifact上で動いている(window.claudeが存在する)のに sample capability が
    // 使えない場合のみ、従来通りAIコーチ機能自体を非表示にする。
    // Claude Artifact以外(window.claudeが無い = ローカル起動・Vercel等)の場合は、
    // OpenAIProvider経由でAIコーチを提供する想定のため非表示にはしない
    // (実際にサーバー側が呼べるかどうかは個々のリクエスト時のエラー表示に委ねる)。
    const inClaudeArtifact = !!(window.claude && typeof window.claude.use==='function');
    if(inClaudeArtifact && !sampleFn) state.adjust.hidden = true;
    // 画像OCR(Garminスクリーンショット等)は今回のスコープ外のままClaude Artifact専用なので、
    // sampleAvailableの判定はsampleFnの有無のまま変更しない
    state.sampleAvailable = !!sampleFn;
    if(sampleFn){
      try{
        const caps = await sampleFn.limits();
        state.sampleImageOk = !!(caps && caps.images);
      }catch(e){ state.sampleImageOk = false; }
    }

    let plans = [];
    try{ plans = await Store.listPlans(); }catch(e){ plans = []; }

    if(!plans.find(p=>p.id==='aqualine-2026')){
      plans.unshift(SEED_PLAN);
      Store.savePlan(SEED_PLAN);
    }
    state.plans = plans;
    state.currentId = plans.find(p=>p.id==='aqualine-2026') ? 'aqualine-2026' : plans[0].id;
    try{ state.completed = await Store.getProgress(state.currentId); }catch(e){ state.completed = {}; }
    try{ state.logs = await Store.getLogs(state.currentId); }catch(e){ state.logs = {}; }
    try{ state.profile = await Store.getProfile(); }catch(e){ /* keep default */ }
    // 認証導入前でもWorkoutを同一端末の利用者に紐付けられるよう、端末内IDを一度だけ発行する。
    if(!state.profile.workoutUserId){
      state.profile.workoutUserId = genId('runner_');
      Store.setProfile(state.profile);
    }
    try{ state.workouts = await Store.getWorkouts(); }catch(e){ state.workouts = []; }
    try{
      const fdoc = await Store.getForecast(state.currentId);
      if(fdoc) state.forecast[state.currentId] = fdoc;
    }catch(e){}
    state.calendarMonth = todayISO().slice(0,7);
    render();
    if(!latestForecastFor(state.currentId)){
      const curPlan = currentPlan();
      if(curPlan) recomputeAndSaveForecast(curPlan).then(function(){ render(); });
    }
  }

  boot();
})();
</script>
