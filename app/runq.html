<!-- Artifact body only: no doctype/html/head/body wrapper -->
<title>RUNQ.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* RUNQ. ブランドガイドラインに準拠したカラートークン(2026-09-08 リデザイン) */
    --bg:#f5f7fa;
    --surface:#ffffff;
    --surface-2:#ebf3ff;
    --border:#e2e8f0;
    --text:#1f2937;
    --text-muted:#6b7280;
    --text-faint:#9ca3af;
    --accent:#0066ff;
    --accent-soft:#ebf3ff;
    --accent-strong:#0b1f3b;
    --mp:#ef4444;
    --mp-soft:#fde8e8;
    --easy:#22c55e;
    --easy-soft:#e3f9ea;
    --rest:#9ca3af;
    --warn:#f59e0b;
    --warn-soft:#fef3c7;
    --shadow:rgba(11,31,59,0.08);
    --focus:#0066ff;
    --logo-chip:transparent;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220;
      --surface:#111a2e;
      --surface-2:#182544;
      --border:#28365a;
      --text:#eaf1ff;
      --text-muted:#9fb0cc;
      --text-faint:#6b7c99;
      --accent:#4d8dff;
      --accent-soft:#16233f;
      --accent-strong:#8fbbff;
      --mp:#f87171;
      --mp-soft:#3b1518;
      --easy:#4ade80;
      --easy-soft:#123321;
      --rest:#6b7c99;
      --warn:#fbbf24;
      --warn-soft:#3a2a0c;
      --shadow:rgba(0,0,0,0.45);
      --focus:#4d8dff;
      --logo-chip:#ffffff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220;
    --surface:#111a2e;
    --surface-2:#182544;
    --border:#28365a;
    --text:#eaf1ff;
    --text-muted:#9fb0cc;
    --text-faint:#6b7c99;
    --accent:#4d8dff;
    --accent-soft:#16233f;
    --accent-strong:#8fbbff;
    --mp:#f87171;
    --mp-soft:#3b1518;
    --easy:#4ade80;
    --easy-soft:#123321;
    --rest:#6b7c99;
    --warn:#fbbf24;
    --warn-soft:#3a2a0c;
    --shadow:rgba(0,0,0,0.45);
    --focus:#4d8dff;
    --logo-chip:#ffffff;
  }

  *{ box-sizing:border-box; }
  html{
    width:100%;
    min-height:100%;
    background:var(--bg);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }
  body{
    width:100%;
    min-width:0;
    min-height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    padding:calc(28px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{ width:100%; min-width:0; max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  h1,h2,h3{ font-family:"Zen Kaku Gothic New",sans-serif; text-wrap:balance; margin:0; }
  .mono{ font-family:"Zen Kaku Gothic New",sans-serif; font-variant-numeric:tabular-nums; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  input, select{ font-family:inherit; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:42px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand-logo{ display:inline-flex; align-items:center; padding:6px 12px; border-radius:12px; background:var(--logo-chip); }
  .brand-logo img{ display:block; height:26px; width:auto; }
  .page-context{ margin:0; color:var(--text-muted); font-size:13px; font-weight:700; letter-spacing:.02em; }

  .tabs{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; }
  .tab-btn{ border:none; background:transparent; color:var(--text-muted); font-weight:600; font-size:13px; padding:9px 18px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .tab-btn.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px var(--shadow); }
  .tab-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -2px 12px var(--shadow); }
  .bottom-nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:none; background:transparent; color:var(--text-faint); font-size:11px; font-weight:600; padding:6px 2px 5px; border-radius:12px; cursor:pointer; }
  .bottom-nav-btn .bn-icon{ display:flex; }
  .bottom-nav-btn.active{ color:var(--accent-strong); background:var(--accent-soft); }
  .bottom-nav-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }

  /* ---------- plan switcher ---------- */
  .plan-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .plan-pill{ flex:0 0 auto; display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:8px 8px 8px 16px; cursor:pointer; color:var(--text-muted); font-size:13px; font-weight:600; white-space:nowrap; }
  .plan-pill.active{ border-color:var(--accent); color:var(--text); background:var(--accent-soft); }
  .plan-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--rest); }
  .plan-pill.active .dot{ background:var(--accent); }
  .plan-pill .del{ border:none; background:transparent; color:var(--text-faint); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .plan-pill .del:hover{ background:var(--surface-2); color:var(--warn); }
  .plan-pill .del.confirm{ background:var(--warn); color:#fff; }
  .plan-pill-add{ flex:0 0 auto; border:1px dashed var(--border); background:transparent; border-radius:999px; padding:8px 16px; color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; }
  .plan-link-arrow{ flex:0 0 auto; align-self:center; color:var(--text-faint); font-size:14px; }

  /* ---------- hero ---------- */
  .hero{ background:linear-gradient(155deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:20px; padding:26px 28px; display:grid; grid-template-columns:auto 1fr auto; gap:26px; align-items:center; }
  @media (max-width:680px){ .hero{ grid-template-columns:1fr; } .hero .countdown{ order:-1; } }
  .countdown{ text-align:center; padding-right:26px; border-right:1px solid var(--border); }
  @media (max-width:680px){ .countdown{ border-right:none; border-bottom:1px solid var(--border); padding-right:0; padding-bottom:16px; } }
  .countdown .num{ font-family:"Zen Kaku Gothic New",sans-serif; font-weight:800; font-size:64px; line-height:1; color:var(--accent-strong); }
  .countdown .lbl{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); margin-top:4px; }
  .hero-meta{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .hero-race{ font-size:24px; font-weight:800; }
  .hero-sub{ font-size:13px; color:var(--text-muted); font-family:"Zen Kaku Gothic New",sans-serif; }
  .hero-link-note{ font-size:12px; color:var(--accent); background:var(--accent-soft); display:inline-block; padding:3px 10px; border-radius:999px; width:fit-content; }
  .hero-stats{ display:flex; gap:18px; flex-wrap:wrap; margin-top:4px; }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .k{ font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); }
  .stat .v{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:15px; font-weight:600; }
  .phase-side{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  @media (max-width:680px){ .phase-side{ align-items:flex-start; } }
  .phase-badge{ background:var(--warn-soft); color:var(--warn); font-weight:700; font-size:12px; padding:6px 14px; border-radius:999px; white-space:nowrap; }
  .ring-wrap{ display:flex; align-items:center; gap:8px; }
  .ring-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; color:var(--text-muted); text-align:right; }
  .ring-label .rl-kicker{ display:block; font-size:9px; letter-spacing:0.1em; color:var(--text-faint); }

  /* ---------- policy / extras cards ---------- */
  .info-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px; }
  .info-card h3{ font-size:15px; font-weight:700; margin-bottom:10px; color:var(--text); }
  .info-card ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; }
  .info-card li{ font-size:13.5px; color:var(--text-muted); line-height:1.55; }
  .policy-toggle{ width:100%; border:none; background:transparent; padding:0; margin:0; font-family:"Zen Kaku Gothic New",sans-serif; font-size:15px; font-weight:700; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
  .policy-card.open .policy-toggle{ margin-bottom:10px; }
  .policy-chevron{ font-size:12px; color:var(--text-faint); transition:transform 0.15s; }
  .policy-card.open .policy-chevron{ transform:rotate(180deg); }
  .policy-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .extras-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:680px){ .extras-grid{ grid-template-columns:1fr; } }

  /* ---------- AI adjust ---------- */
  .adjust-card .lede{ font-size:12.5px; color:var(--text-muted); margin-bottom:10px; }
  .adjust-card textarea{ width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit; resize:vertical; min-height:60px; }
  .adjust-card textarea:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .adjust-actions{ display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .adjust-status{ font-size:12.5px; color:var(--text-muted); }
  .adjust-status.error{ color:var(--mp); }
  .adjust-summary{ margin-top:12px; background:var(--easy-soft); color:var(--easy); border-radius:10px; padding:10px 14px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .undo-btn{ background:transparent; border:1px solid currentColor; color:inherit; border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer; flex:0 0 auto; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--text-muted); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-secondary:hover{ color:var(--text); border-color:var(--text-muted); }
  .risk-callout{ display:flex; align-items:flex-start; gap:8px; background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.55; margin-bottom:12px; }
  .risk-callout svg{ flex:0 0 auto; margin-top:2px; }
  .option-list{ display:flex; flex-direction:column; gap:10px; }
  .option-card{ border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--bg); }
  .option-label{ font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .option-summary{ font-size:13px; color:var(--text-muted); line-height:1.55; margin-bottom:10px; }
  .option-choose-btn{ padding:8px 18px; font-size:13px; }
  .option-card.chosen{ opacity:0.7; }
  .chosen-tag{ font-size:10px; font-weight:700; color:var(--easy); background:var(--easy-soft); padding:1px 8px; border-radius:999px; margin-left:4px; }

  /* ---------- AIコーチ チャットUI(Phase7) ---------- */
  .coach-chat-card{ display:flex; flex-direction:column; gap:12px; }
  .chat-thread{ display:flex; flex-direction:column; gap:10px; max-height:56vh; overflow-y:auto; padding:2px 2px 4px; }
  .chat-empty{ font-size:13px; color:var(--text-faint); text-align:center; padding:26px 0; }
  .chat-msg{ display:flex; }
  .chat-msg.chat-user{ justify-content:flex-end; }
  .chat-msg.chat-coach{ justify-content:flex-start; }
  .chat-bubble{ max-width:85%; background:var(--surface-2); color:var(--text); border-radius:14px 14px 14px 4px; padding:10px 14px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; }
  .chat-msg.chat-user .chat-bubble{ background:var(--accent); color:#fff; border-radius:14px 14px 4px 14px; }
  .chat-bubble.chat-error{ background:var(--warn-soft); color:var(--warn); }
  .chat-bubble.chat-muted{ background:transparent; border:1px dashed var(--border); color:var(--text-faint); }
  .chat-bubble .undo-btn{ display:block; margin-top:8px; }
  .chat-bubble-options{ max-width:100%; width:100%; }
  .chat-bubble-options .risk-callout{ margin-bottom:10px; }
  .chat-bubble-options .option-list{ gap:8px; }
  .chat-stale-note{ font-size:11.5px; color:var(--text-faint); margin-top:8px; }
  .chat-bubble.chat-typing{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; color:var(--text-faint); background:var(--surface-2); }
  .chat-typing-row{ display:flex; align-items:center; gap:8px; }
  /* 応答速度の体感改善: sample.jsonのonTextでストリーミングされてくる生JSONから
     summary/riskの値だけを抜き出して、確定前のプレビューとして薄く表示する */
  .chat-stream-preview{ font-size:12.5px; color:var(--text-muted); line-height:1.55; white-space:pre-wrap; }
  .typing-dots{ display:inline-flex; gap:3px; }
  .typing-dots span{ width:5px; height:5px; border-radius:50%; background:var(--text-faint); display:inline-block; animation:typing-bounce 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2){ animation-delay:0.15s; }
  .typing-dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes typing-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.5; } 30%{ transform:translateY(-3px); opacity:1; } }
  .chat-input-row{ display:flex; gap:8px; align-items:flex-end; border:1px solid var(--border); border-radius:24px; padding:7px 8px 7px 15px; background:var(--surface); box-shadow:0 2px 10px rgba(20,45,90,.06); }
  .chat-input-row:focus-within{ border-color:var(--border); box-shadow:0 2px 10px rgba(20,45,90,.1); }
  /* GPTのように、入力面と送信操作を一つのコンポーザーにまとめる。Enterは改行、矢印ボタンで送信。 */
  .chat-input-row textarea{ flex:1 1 auto; min-height:28px; max-height:120px; border:0; outline:0; box-shadow:none; background:transparent; border-radius:0; padding:8px 2px; line-height:1.45; resize:none; }
  .chat-input-row textarea:focus{ border:0; box-shadow:none; }
  .chat-send-btn{ flex:0 0 auto; width:36px; height:36px; min-width:36px; border-radius:50%; padding:0; display:grid; place-items:center; font-size:19px; line-height:1; }
  .chat-send-btn span{ transform:translateY(-1px); }
  .chat-cancel-btn{ flex:0 0 auto; padding:11px 16px; font-size:12px; }
  .history-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .history-list li{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .history-date{ color:var(--text-faint); font-size:11px; flex:0 0 auto; }
  .history-summary{ color:var(--text); }
  .history-reason{ color:var(--text-faint); font-size:11.5px; width:100%; }

  /* ---------- コーチタブの全画面表示 ----------
     カード型のボックスに収まっていると狭く操作しにくいという要望への対応。
     コーチタブの時だけbodyに.mode-coachを付与し、トップバー/入力欄を固定した上で
     チャットスレッド部分だけが画面の残り高さいっぱいにスクロールする構成に切り替える。
     他のタブ(ホーム/プラン/マイページ)のレイアウトには一切影響しない。 */
  body.mode-coach{ padding:0; height:100vh; overflow:hidden; }
  body.mode-coach .wrap{ height:100%; max-width:100%; margin:0; gap:0; }
  body.mode-coach .topbar{ flex:0 0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px 10px; }
  body.mode-coach .bottom-nav{ position:static; flex:0 0 auto; box-shadow:none; }
  body.mode-coach .wrap > .info-card{ flex:1 1 auto; min-height:0; margin:0 16px 16px; overflow-y:auto; }
  body.mode-coach .coach-chat-card{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:0;
    background:transparent; border:none; border-radius:0; box-shadow:none; padding:0;
  }
  body.mode-coach .coach-chat-card h3{ padding:0 16px; }
  body.mode-coach .coach-chat-card .lede{ padding:0 16px; margin-bottom:10px; }
  body.mode-coach .chat-thread{ flex:1 1 auto; min-height:0; max-height:none; padding:4px 16px 8px; }
  body.mode-coach .chat-input-row{
    flex:0 0 auto; margin:0 12px calc(10px + env(safe-area-inset-bottom)); padding:7px 8px 7px 15px;
  }

  /* ---------- week cards ---------- */
  .weeks{ display:flex; flex-direction:column; gap:14px; }
  .week-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px 8px; }
  .week-card.current{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .week-card.past{ opacity:0.68; }
  .week-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .week-head-left{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .week-num{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:0.1em; color:var(--text-faint); }
  .week-phase{ font-size:18px; font-weight:700; }
  .week-range{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:12px; color:var(--text-muted); }
  .today-chip{ background:var(--accent); color:#fff; font-size:10px; font-weight:700; letter-spacing:0.06em; padding:3px 8px; border-radius:999px; }
  .week-progress{ display:flex; align-items:center; gap:8px; }
  .week-progress .bar{ width:64px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .week-progress .fill{ height:100%; background:var(--easy); }
  .week-progress .txt{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; color:var(--text-muted); }

  .item-row{ display:grid; grid-template-columns:26px 58px 96px 1fr; gap:12px; align-items:start; padding:11px 0; border-top:1px solid var(--border); }
  .item-row:first-of-type{ border-top:none; }
  @media (max-width:560px){
    .item-row{ display:flex; flex-wrap:wrap; align-items:center; column-gap:10px; row-gap:8px; padding:12px 0; }
    .item-row .item-check{ flex:0 0 auto; padding-top:0; }
    .item-row .item-day{ flex:0 0 auto; }
    .item-row .chip{ flex:0 0 auto; }
    .item-row .item-body{ flex:1 1 100%; min-width:0; }
  }
  .item-check{ padding-top:2px; }
  .item-check input{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
  .item-day{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:12px; color:var(--text-muted); line-height:1.35; }
  .item-day .d{ display:block; font-weight:600; color:var(--text); }
  .chip{ align-self:start; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:12px; text-align:center; line-height:1.3; }
  .chip.mp{ background:var(--mp-soft); color:var(--mp); }
  .chip.long{ background:var(--accent); color:#fff; }
  .chip.easy{ background:var(--easy-soft); color:var(--easy); }
  .chip.rest{ background:transparent; color:var(--text-faint); border:1px solid var(--border); }
  .chip.preRace{ background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .chip.race{ background:linear-gradient(120deg,var(--mp),var(--warn)); color:#fff; }
  .chip.event{ background:var(--accent-soft); color:var(--accent-strong); border:1px solid var(--accent); }
  .item-body{ min-width:0; }
  .item-title-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .item-title{ font-weight:600; font-size:13.5px; }
  .item-desc{ font-size:13px; color:var(--text-muted); line-height:1.55; margin-top:2px; }
  .item-row.done .item-title, .item-row.done .item-desc{ color:var(--text-faint); text-decoration:line-through; text-decoration-thickness:1px; text-decoration-color:var(--border); }
  .peak-tag{ font-size:10px; font-weight:700; letter-spacing:0.06em; color:var(--mp); border:1px solid var(--mp); border-radius:999px; padding:1px 7px; }
  .warn-flag{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--warn); background:var(--warn-soft); padding:5px 9px; border-radius:8px; }
  .warn-flag svg{ flex:0 0 auto; }

  /* ---------- generator form ---------- */
  .form-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:26px 28px; }
  .form-card h2{ font-size:22px; margin-bottom:4px; }
  .form-card .lede{ font-size:13.5px; color:var(--text-muted); margin-bottom:22px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 22px; }
  @media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); }
  .field .hint{ font-size:11.5px; color:var(--text-faint); }
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:10px 12px; font-size:16px; width:100%;
  }
  .field input:focus-visible, .field select:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .field.err input{ border-color:var(--mp); }
  .field .errmsg{ font-size:11.5px; color:var(--mp); min-height:14px; }
  /* 時間/分/秒等のselectと単位ラベル(分・秒/km等)を横並びにする共通コンポーネント。
     line-heightを明示しているのは、指定しない場合ブラウザ(特にiOS Safariのネイティブselect)ごとに
     既定のline-heightが異なり、align-items:centerで揃えていても隣の単位ラベルとわずかに
     ズレて見えることがあるため。selectとunitで同じline-height/font設定を揃えて崩れを防ぐ */
  .time-picker{ display:flex; align-items:center; gap:8px; }
  .time-picker select{ border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:10px; padding:11px 6px; font-size:16px; line-height:1.2; text-align:center; flex:1 1 auto; min-width:0; vertical-align:middle; }
  .time-picker .sep{ color:var(--text-faint); font-weight:600; flex:0 0 auto; white-space:nowrap; line-height:1.2; }
  .time-picker .unit{ font-size:12px; color:var(--text-faint); flex:0 0 auto; white-space:nowrap; line-height:1.2; align-self:center; }
  .time-picker.num-picker select{ flex:1 1 0; }
  .switch-row{ display:flex; align-items:center; gap:10px; grid-column:1/-1; padding-top:4px; }
  .switch-row label{ font-size:13px; color:var(--text); }
  .switch-row .hint{ display:block; margin-top:2px; }
  .form-actions{ grid-column:1/-1; display:flex; align-items:center; gap:14px; margin-top:6px; }
  .btn-primary{ background:var(--accent); color:#fff; border:none; border-radius:999px; padding:12px 26px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .form-note{ font-size:12px; color:var(--text-faint); }
  .pace-preview{ font-size:20px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); display:inline-block; padding:6px 16px; border-radius:10px; width:fit-content; }
  .pace-suggestion{ margin-top:10px; font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pace-suggestion.muted{ color:var(--text-faint); }
  .pace-suggestion .btn-secondary{ padding:5px 12px; font-size:12px; }

  /* ---------- view toggle ---------- */
  .view-toggle{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; align-self:flex-start; }

  /* ---------- calendar ---------- */
  .calendar-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:12px; }
  .cal-nav-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; }
  .cal-nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .cal-month{ font-size:14px; font-weight:600; min-width:110px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekday-row{ margin-bottom:4px; }
  .cal-weekday{ text-align:center; font-size:11px; color:var(--text-faint); font-family:"Zen Kaku Gothic New",sans-serif; padding-bottom:2px; }
  .cal-cell{ position:relative; aspect-ratio:1/1; border:1px solid var(--border); background:var(--bg); border-radius:10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 2px; color:var(--text); font-family:inherit; }
  .cal-cell.empty{ border:none; background:transparent; cursor:default; }
  .cal-cell.has-item{ background:var(--surface-2); }
  .cal-cell.today{ border-color:var(--accent); }
  .cal-cell.selected{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); background:var(--accent-soft); }
  .cal-daynum{ font-size:12px; font-family:"Zen Kaku Gothic New",sans-serif; }
  .cal-dots{ display:flex; gap:2px; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--rest); }
  .cal-dot.mp{ background:var(--mp); }
  .cal-dot.long{ background:var(--accent); }
  .cal-dot.easy{ background:var(--easy); }
  .cal-dot.event{ background:var(--accent-strong); }
  .cal-dot.race{ background:var(--warn); }
  .cal-dot.preRace{ background:var(--warn); }
  .cal-log-mark{ position:absolute; top:3px; right:5px; font-size:9px; color:var(--easy); font-weight:700; }
  .cal-detail{ margin-top:14px; }
  .cal-detail-date{ font-size:13px; color:var(--text-muted); margin-bottom:4px; }
  .cal-detail-empty{ font-size:13px; color:var(--text-faint); padding:14px 0; text-align:center; }
  .calendar-card + .cal-detail{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }

  /* ---------- logging ---------- */
  .log-btn{ margin-top:8px; border:1px solid var(--border); background:transparent; color:var(--accent); border-radius:999px; padding:5px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .log-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .log-summary{ margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface-2); border-radius:8px; padding:6px 10px; }
  .log-summary-txt{ font-size:12px; color:var(--text); }
  .log-edit-btn{ border:none; background:transparent; color:var(--accent); font-size:11.5px; font-weight:600; cursor:pointer; padding:0; }
  .feedback-callout{ margin-top:6px; background:var(--accent-soft); color:var(--accent-strong); border-radius:8px; padding:8px 12px; font-size:12.5px; line-height:1.5; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .feedback-callout.busy{ color:var(--text-muted); background:var(--surface-2); }
  .log-form{ margin-top:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .log-image-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--border); }
  .log-image-btn{ position:relative; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-strong); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .log-image-btn:hover{ filter:brightness(1.03); }
  .log-image-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .log-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  @media (max-width:480px){ .log-grid{ grid-template-columns:1fr; } }
  .log-form textarea{ width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px; padding:8px 10px; font-size:16px; font-family:inherit; resize:vertical; min-height:40px; }
  .log-form-actions{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .segmented{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .segmented-opt{ display:flex; align-items:center; gap:5px; border:1px solid var(--border); background:var(--bg); border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--text-muted); cursor:pointer; }
  .segmented-opt input{ width:14px; height:14px; accent-color:var(--accent); margin:0; }
  .segmented-opt.active, .segmented-opt:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); color:var(--text); font-weight:600; }
  .segmented.small .segmented-opt{ padding:4px 10px; font-size:11.5px; }
  .segmented.small .segmented-opt input{ width:12px; height:12px; }
  .pain-parts{ margin-top:8px; }

  /* ---------- delete confirmation modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,15,20,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:360px; width:100%; box-shadow:0 12px 40px var(--shadow); }
  .modal-card h3{ font-size:17px; margin-bottom:8px; }
  .modal-card p{ font-size:13.5px; color:var(--text-muted); line-height:1.6; margin:0 0 18px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .btn-danger{ background:var(--mp); color:#fff; border:none; border-radius:999px; padding:9px 20px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-danger:hover{ filter:brightness(1.06); }

  /* ---------- my page ---------- */
  .mypage-grid{ display:flex; flex-direction:column; gap:18px; }
  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .list-row:first-of-type{ border-top:none; }
  .list-row .li-main{ font-size:13.5px; color:var(--text); }
  .list-row .li-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .list-row .li-remove{ border:none; background:transparent; color:var(--text-faint); font-size:13px; cursor:pointer; flex:0 0 auto; }
  .list-row .li-remove:hover{ color:var(--mp); }
  .inline-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
  .inline-form .field{ flex:1 1 140px; min-width:120px; }
  .inline-form .btn-primary{ padding:10px 20px; }
  /* 自己ベストの「タイム」欄(時間/分/秒の3つのselectを含む)は、他の項目(種目セレクト等)と
     横並びで幅を分け合うと1つ1つが極端に狭くなり操作しづらいため、常に単独の行いっぱいに
     広げる。送信ボタンもその下の行に幅いっぱいで置き、タップしやすくする(モバイル優先) */
  .inline-form .field-full{ flex:1 1 100%; min-width:0; }
  .inline-form .btn-block{ flex:1 1 100%; width:100%; }
  .inline-form .field-full .time-picker{ gap:8px; }
  .inline-form .field-full .time-picker select{ padding:12px 6px; font-size:17px; }
  .shoe-row-actions{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .shoe-status-badge{ font-size:10px; font-weight:700; letter-spacing:0.04em; padding:2px 8px; border-radius:999px; background:var(--easy-soft); color:var(--easy); }
  .shoe-status-badge.retired{ background:var(--surface-2); color:var(--text-faint); }
  .shoe-edit-form{ border-top:none !important; margin-top:0 !important; padding-top:8px !important; }
  .sim-table{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .sim-table li{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border); }
  .sim-table li:first-child{ border-top:none; }
  .sim-table .sim-dist{ color:var(--text-muted); }
  .sim-table li.sim-input{ font-weight:700; color:var(--accent-strong); }
  /* ---------- my page: 新レイアウト(RUNNER PROFILE / MY SHOES / RUNNING TOOLS / TRAINING SETTINGS / SETTINGS) ---------- */
  .runner-profile-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .runner-profile-head h3{ margin:0; }
  .runner-profile-head .li-remove{ border:none; background:transparent; color:var(--text-faint); font-size:13px; cursor:pointer; flex:0 0 auto; white-space:nowrap; }
  .runner-profile-head .li-remove:hover{ color:var(--accent); }
  .runner-pb-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
  .runner-pb-tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 4px; text-align:center; }
  .rpb-label{ font-size:10px; letter-spacing:0.06em; color:var(--text-faint); text-transform:uppercase; }
  .rpb-time{ font-size:13.5px; font-weight:700; margin-top:4px; color:var(--text); }
  .mypage-edit-block{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .mypage-tool-row{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:transparent; border:none; border-top:1px solid var(--border); padding:12px 0; cursor:pointer; font:inherit; color:inherit; }
  .mypage-tool-row:first-of-type{ border-top:none; }
  .mypage-tool-row:hover .li-main{ color:var(--accent); }
  .mypage-menu-chevron{ color:var(--text-faint); font-size:13px; flex:0 0 auto; margin-left:10px; }
  .mypage-menu-row{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; cursor:pointer; font:inherit; color:inherit; }
  .mypage-menu-row:hover{ border-color:var(--accent); }
  .mypage-menu-row .li-main{ font-size:14px; font-weight:600; }
  .mypage-subhead{ display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
  .mypage-back-btn{ align-self:flex-start; border:none; background:transparent; color:var(--text-muted); font-size:13px; padding:4px 0 8px; cursor:pointer; }
  .mypage-back-btn:hover{ color:var(--accent); }
  .mypage-toast{ background:var(--easy-soft); color:var(--easy); font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:14px; }

  .foot-note{ text-align:center; font-size:11.5px; color:var(--text-faint); padding-top:6px; }

  /* ---------- home dashboard ---------- */
  .home-dashboard{ display:flex; flex-direction:column; gap:18px; padding-bottom:4px; }
  .home-dashboard .hero{ margin:0; }
  .home-quest{
    background:transparent;
    border:none;
    border-radius:0;
    box-shadow:none;
    padding:2px 2px 0;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:10px 14px;
    align-items:start;
  }
  .home-quest .hero-meta{ gap:4px; }
  .home-quest .quest-kicker{ font-size:10px; letter-spacing:.1em; }
  .home-quest .hero-race{ font-size:19px; line-height:1.35; }
  .home-quest .hero-sub{ font-size:12px; }
  .home-quest .hero-stats{ gap:14px; margin-top:6px; }
  .home-quest .stat .k{ font-size:9px; letter-spacing:.06em; }
  .home-quest .stat .v{ font-size:13px; }
  .home-quest .countdown{
    min-width:76px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--surface);
    text-align:right;
  }
  .home-quest .countdown .num{ font-size:25px; color:var(--accent-strong); }
  .home-quest .countdown .lbl{ font-size:9px; letter-spacing:.06em; text-transform:none; margin:0 0 2px; }
  .home-quest .phase-side{ grid-column:1 / -1; align-items:flex-start; }
  .home-quest .quest-newquest-btn{ padding:7px 0; border:none; background:transparent; color:var(--text-muted); font-size:12px; }
  .home-quest .quest-newquest-btn:hover{ color:var(--accent); }
  .today-card{
    padding:20px;
    border-color:var(--border);
    background:linear-gradient(145deg,var(--accent-soft) 0%,var(--surface) 66%);
    box-shadow:0 10px 26px var(--shadow);
  }
  .today-heading{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .today-heading h3{ margin:2px 0 0; font-size:21px; letter-spacing:-.02em; }
  .today-heading .eyebrow,
  .home-section-head .eyebrow{ display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--accent); }
  .today-date{ color:var(--text-muted); font-size:12px; padding-top:4px; white-space:nowrap; }
  .today-card .weeks{ margin:0; }
  .today-card .week-card{ background:var(--surface); border-color:var(--border); padding:12px 14px 6px; border-radius:14px; }
  .today-card .item-row{ padding-top:4px; }
  .today-card .rest-banner{ background:var(--surface); border:1px solid var(--border); }
  .today-card .next-run{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .today-card .next-run-label{ color:var(--accent); }
  .todays-point{ background:var(--surface); border:1px solid var(--border); padding:11px 13px; }
  .todays-point .tp-label{ color:var(--accent-strong); }
  .home-section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .home-section-head h3{ margin:0; font-size:16px; }
  .this-week-card,.forecast-card{ padding:18px 20px; }
  .this-week-card > h3,.forecast-card > h3{ display:none; }
  .this-week-card{ gap:10px; }
  .week-mini-item{ grid-template-columns:46px 1fr 22px; padding:9px 0; }
  .week-mini-item.today{ margin:0 -6px; padding:9px 6px; background:var(--accent-soft); }
  .week-progress-line{ margin-top:2px; }
  .this-week-card .btn-secondary{ align-self:flex-start; padding:8px 0; border:none; background:transparent; color:var(--accent); }
  .forecast-card{ background:var(--surface); }
  .forecast-range{ padding-top:0; }
  .home-coach-link{ justify-content:flex-start; margin:-6px 0 2px; }
  .home-coach-link .btn-secondary{ padding:8px 0; border:none; background:transparent; color:var(--text-muted); font-size:12px; }
  .home-coach-link .btn-secondary:hover{ color:var(--accent); }
  @media (max-width:680px){
    .home-quest{ grid-template-columns:minmax(0,1fr) auto; }
    .home-quest .countdown{ order:initial; border:1px solid var(--border); padding:8px 10px; }
    .home-quest .phase-side{ grid-column:1 / -1; }
  }
  @media (max-width:560px){
    .home-dashboard{ gap:16px; }
    .home-quest{ padding:2px 0 0; }
    .home-quest .countdown{ min-width:72px; }
    .home-quest .countdown .num{ font-size:23px; }
    .today-card{ padding:18px 16px; }
    .today-heading h3{ font-size:20px; }
    .this-week-card,.forecast-card{ padding:16px; }
  }
  .quest-card.empty{ grid-template-columns:1fr; }
  .quest-kicker{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); }
  .quest-newquest-btn{ white-space:nowrap; }
  .today-card .rest-banner{ font-size:13.5px; color:var(--text-muted); background:var(--surface-2); border-radius:10px; padding:12px 14px; }
  .today-card .weeks{ margin-top:2px; }
  .next-run{ margin-top:14px; }
  .next-run-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; letter-spacing:0.1em; color:var(--text-faint); margin-bottom:6px; }
  .todays-point{ margin-top:10px; background:var(--accent-soft); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:3px; }
  .todays-point .tp-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:10px; letter-spacing:0.1em; color:var(--accent-strong); font-weight:700; }
  .todays-point .tp-text{ font-size:13px; color:var(--text); line-height:1.5; }
  .this-week-card{ display:flex; flex-direction:column; gap:12px; }
  .week-mini-list{ display:flex; flex-direction:column; gap:2px; }
  .week-mini-item{ display:grid; grid-template-columns:52px 1fr 22px; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); }
  .week-mini-item .chip{ justify-self:start; }
  .week-mini-item:first-child{ border-top:none; }
  .week-mini-item.today{ background:var(--accent-soft); margin:0 -10px; padding:8px 10px; border-radius:8px; border-top:none; }
  .week-mini-item.done .wmi-day{ color:var(--text-faint); }
  .wmi-day{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:12px; color:var(--text-muted); }
  .wmi-check{ color:var(--easy); font-weight:700; text-align:center; }
  .week-progress-line{ font-size:12px; color:var(--text-muted); }
  .week-progress-line .wpl-kicker{ font-size:10px; letter-spacing:0.1em; color:var(--text-faint); margin-right:6px; }
  .home-coach-link{ display:flex; justify-content:center; }
  .home-coach-link .btn-secondary{ padding:10px 22px; }

  /* ---------- RACE FORECAST ---------- */
  .forecast-range{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:4px 0 14px; }
  .forecast-goal{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .forecast-goal .fg-label{ font-family:"Zen Kaku Gothic New",sans-serif; font-size:10px; letter-spacing:0.08em; color:var(--text-faint); }

</style>

  /* ============================================================
     date + pace helpers
  ============================================================ */
  const WEEKDAY_JA = ['日','月','火','水','木','金','土'];
  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseISO(s){
    if(!s) return null;
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function addDays(d, n){ const nd = new Date(d.getTime()); nd.setDate(nd.getDate()+n); return nd; }
  function fmtMD(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
  function todayLocal(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
  function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }

  function paceSecToLabel(sec){
    sec = Math.round(sec);
    const m = Math.floor(sec/60), s = sec%60;
    return m+':'+pad(s);
  }
  function hmsToSeconds(str){
    const parts = str.trim().split(':').map(Number);
    if(parts.some(isNaN)) return null;
    if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
    if(parts.length===2) return parts[0]*60+parts[1];
    return null;
  }
  function paceBandFromTarget(targetSec, distanceKm, gapMult){
    gapMult = gapMult || 1;
    const center = targetSec/distanceKm;
    const mpLow = center-7, mpHigh = center+7;
    const easyLow = mpHigh+24*gapMult, easyHigh = mpLow+68*gapMult;
    return {
      mpLow, mpHigh, easyLow, easyHigh,
      mpLabel: paceSecToLabel(mpLow)+'〜'+paceSecToLabel(mpHigh)+'/km',
      easyLabel: paceSecToLabel(easyLow)+'〜'+paceSecToLabel(easyHigh)+'/km'
    };
  }
  function formatKm(n){
    n = Math.round(n*2)/2;

  function gelSchedule(durationMin){
    if(durationMin < 68) return null;
    const times = [];
    let t = durationMin > 100 ? 60 : 70;
    while(t < durationMin-8){ times.push(t); t += 40; }
    return times.length ? times : null;
  }

  function secToHMSLabel(sec){
    sec = Math.round(sec);

  // 未入力(空欄)を許容するselect。先頭に「‐‐」を置く

  // 画像解析・手入力で生じる単位つきペース表記を、ログの共通形式 m:ss に揃える。
  function normalizePaceLabel(value){
    if(value==null || value==='') return null;
    const text = String(value).replace(/：/g,':').replace(/[′’]/g,"'");
    const match = text.match(/(\d{1,2})\s*(?::|分|m|')\s*(\d{1,2})/i);
    if(!match) return null;
    const minutes=Number(match[1]), seconds=Number(match[2]);
    if(!Number.isInteger(minutes) || !Number.isInteger(seconds) || minutes<1 || minutes>30 || seconds>59) return null;
    return minutes+':'+pad(seconds);

  // 目標タイムから1kmあたりのペースを表示する
  function paceLabelForTarget(distanceKm, sec){
    if(!distanceKm || !sec) return null;
    return paceSecToLabel(sec/distanceKm)+'/km';
  }
  // RACE TIME PREDICTOR(旧PACE SIMULATOR)専用: 1つのレース記録(自己ベスト)から、
  // 他距離での走力を「リーゲルの式(Riegel's formula): T2 = T1 × (D2/D1)^1.06」で推定する。
  // これは「同じペースで走った場合のタイム」ではなく、距離が伸びるほど平均ペースは
  // 落ちるという経験則(指数1.06)に基づく走力換算。単純なペース計算(距離×ペース)は
  // 行わない点がPACE CALCULATOR(paceCalcSplits)との決定的な違い
  function predictSecFromPB(pb, targetDistanceKm){
    if(!pb || !pb.distanceKm || !pb.timeSec || !targetDistanceKm) return null;
    return Math.round(pb.timeSec * Math.pow(targetDistanceKm/pb.distanceKm, 1.06));
  }
  // 登録済みの自己ベストの中から、目標距離に最も近い(換算精度が高い)ものを選ぶ
  // pbsOverrideを渡すとstate.profileに依存しない純粋な呼び出しになる(RACE FORECASTから使用)
  function bestPbForDistance(targetDistanceKm, pbsOverride){
    const pbs = pbsOverride || (state.profile && state.profile.pbs) || [];
    if(!pbs.length || !targetDistanceKm) return null;
    let best = null, bestScore = Infinity;
    pbs.forEach(function(pb){
      if(!pb.distanceKm || !pb.timeSec) return;
      const score = Math.abs(Math.log(pb.distanceKm/targetDistanceKm));
      if(score < bestScore){ bestScore = score; best = pb; }
    });
    return best;
  }

  /* ============================================================
     PACE CALCULATOR — 純粋なペース計算(距離÷タイム、または距離×ペース)。
     RACE TIME PREDICTOR(predictSecFromPB、リーゲルの式による距離補正)とは明確に別物。
     ここでは一切の走力補正を行わず、単純な算数だけで通過タイムを算出する
  ============================================================ */
  const PACE_CALC_SPLIT_POINTS = [
    {km:5, label:'5km'},
    {km:10, label:'10km'},
    {km:21.0975, label:'HALF'},
    {km:30, label:'30km'},

  // distanceKm(ゴール距離)とpaceSecPerKm(1kmあたりの秒数)から、通過タイムの一覧を返す純粋関数。
  // ゴール距離未満の基準地点(5/10/HALF/30/40km)のみ残し、末尾に必ずGOAL(=ゴール距離)を追加する
  function paceCalcSplits(distanceKm, paceSecPerKm){
    if(!distanceKm || !paceSecPerKm) return [];
    const points = PACE_CALC_SPLIT_POINTS.filter(function(p){ return p.km < distanceKm - 0.001; });
    points.push({km:distanceKm, label:'GOAL'});
    return points.map(function(p){ return { label:p.label, km:p.km, sec: Math.round(p.km*paceSecPerKm) }; });
  }

  function refreshTargetPacePreview(form){

    const distanceKm = parseFloat(form.distance.value)||0;

    const sec = h*3600+m*60+s;
    const previewEl = form.querySelector('#target-pace-preview');
    if(previewEl) previewEl.textContent = paceLabelForTarget(distanceKm, sec) || '—';
    const suggEl = form.querySelector('#target-pace-suggestion');
    if(suggEl){
      const pb = bestPbForDistance(distanceKm);
      const predictedSec = pb ? predictSecFromPB(pb, distanceKm) : null;
      suggEl.outerHTML = pbSuggestionHTML(pb, predictedSec);
    }

  /* ============================================================
     RACE FORECAST — 純粋関数(数値計算のみ。説明文言はAI/表示側が担当)
     入力データから予想タイムレンジを算出する。詳細ロジックは
     claude/run-quest-v1-plan.md の「⑧ RACE FORECAST 実装案」を参照。
  ============================================================ */
  const FORECAST_ALGO_VERSION = 'v1';

  function parsePaceLabel(label){
    if(!label) return null;
    const parts = label.replace('/km','').split('〜');
    if(parts.length!==2) return null;
    const low = hmsToSeconds(parts[0].trim());
    const high = hmsToSeconds(parts[1].trim());
    if(low==null || high==null) return null;
    return { low:low, high:high };
  }

  function flattenPlanItems(plan){
    const out = [];
    plan.weeks.forEach(function(wk, wi){
      wk.items.forEach(function(it, ii){
        out.push({ wi:wi, ii:ii, type:it.type, date:it.date });
      });
    });
    return out;
  }

  // レース距離ティアごとの「直近ロング走ベスト実施距離 ÷ レース距離」の目安レンジ
  function longRunRatioTarget(distanceKm){
    if(distanceKm>=30) return { min:0.60, max:0.75 };
    if(distanceKm>=15) return { min:0.70, max:0.85 };
    return { min:0.80, max:1.00 };
  }

  // 中央値をキリの良い値に丸める。42.195km/ハーフ級は「サブ○時間」の壁が僅かに先にある場合、壁を優先
  function roundToNiceGoal(sec, distanceKm){
    if(distanceKm>=15){
      const stepSec = 1800;
      const lowerWall = Math.floor(sec/stepSec)*stepSec;
      if(lowerWall>0 && (sec-lowerWall)<=stepSec*0.1) return lowerWall;
    }
    return Math.round(sec/10)*10;
  }

  /**
   * estimateRacePerformance — 直近の練習実績を踏まえたレース予想タイムを算出する。
   * @param {object} input
   *   plan             対象プラン(plans/{id}のオブジェクト)
   *   pbs              profile.pbs(自己ベスト配列)
   *   logs             対象プランのログ({date: {...}})
   *   completed        対象プランの進捗({"w{wi}-{ii}": true})
   *   today            基準日(Dateオブジェクト。省略時はtodayLocal())
   *   fallbackTargetSec 自己ベスト未登録時に使う基準タイム(秒)。通常はplan.meta.targetLabelを渡す
   *   prevForecast     直近のforecastスナップショット({predictedSec, ...}) — 平滑化用
   * @returns 予想結果オブジェクト、または算出不可の場合はnull
   */
  function estimateRacePerformance(input){
    const plan = input.plan;
    if(!plan || !plan.meta) return null;
    const raceDistanceKm = plan.meta.distanceKm;
    if(!raceDistanceKm) return null;

    const pbs = input.pbs || [];
    const logs = input.logs || {};
    const completed = input.completed || {};
    const today = input.today || todayLocal();
    const prevForecast = input.prevForecast || null;
    const raceDate = parseISO(plan.meta.raceDate);
    const daysToRace = raceDate ? daysBetween(today, raceDate) : null;
    const windowStart = addDays(today, -28);
    const planItems = flattenPlanItems(plan);
    const mainFactors = [];

    // 1) speed baseline — 自己ベストからの換算(リーゲルの式)。無ければ申告済みの目標タイムを基準に
    const pb = bestPbForDistance(raceDistanceKm, pbs);
    let baseSec;
    if(pb){
      baseSec = predictSecFromPB(pb, raceDistanceKm);
      mainFactors.push({ label:'自己ベストからの換算', value: pb.label+' '+pb.timeLabel, impact:'basis' });
    } else if(input.fallbackTargetSec){
      baseSec = input.fallbackTargetSec;
      mainFactors.push({ label:'自己ベスト未登録', value:'申告した目標タイムを基準に使用', impact:'basis' });
    } else {
      return null;
    }

    let factor = 1.0; // 1.0を基準に、値が大きいほど減速(遅く)方向へ補正

    // 2) 持久力補正 — 直近ログでのロング走の最大実施距離 ÷ レース距離
    const longDates = planItems.filter(function(p){ return p.type==='long' && p.date; }).map(function(p){ return p.date; });
    let maxLongRun = 0;
    longDates.forEach(function(d){
      const log = logs[d];
      if(log && log.distanceKm && Number(log.distanceKm)>maxLongRun) maxLongRun = Number(log.distanceKm);
    });
    if(maxLongRun>0){
      const ratio = maxLongRun/raceDistanceKm;
      const target = longRunRatioTarget(raceDistanceKm);
      if(ratio < target.min){
        const shortfallPct = (target.min-ratio)/target.min*100;
        factor += Math.min(0.15, shortfallPct*0.004);
        mainFactors.push({ label:'ロング走の実績', value: formatKm(maxLongRun)+'(目安の'+Math.round(ratio*100)+'%)', impact:'slower' });
      } else {
        mainFactors.push({ label:'ロング走の実績', value: formatKm(maxLongRun)+'(目安達成)', impact:'good' });
      }
    } else {
      mainFactors.push({ label:'ロング走の実績', value:'まだ記録がありません', impact:'neutral' });
    }

    // 3) 週間走行量トレンド(直近4週平均)
    let volSum = 0;
    Object.keys(logs).forEach(function(d){
      const dt = parseISO(d);
      if(dt && dt>=windowStart && dt<=today && logs[d] && logs[d].distanceKm) volSum += Number(logs[d].distanceKm);
    });
    const weeklyAvgKm = volSum/4;
    if(volSum>0){
      const expectedWeekly = raceDistanceKm * (raceDistanceKm>=30 ? 1.6 : raceDistanceKm>=15 ? 1.3 : 1.0);
      if(weeklyAvgKm < expectedWeekly*0.6){
        factor += 0.05;
        mainFactors.push({ label:'直近4週の週間走行距離', value:Math.round(weeklyAvgKm)+'km/週', impact:'slower' });
      } else {
        mainFactors.push({ label:'直近4週の週間走行距離', value:Math.round(weeklyAvgKm)+'km/週', impact:'neutral' });
      }
    }

    // 4) 実施率(アドヒアランス) — 直近4週で予定していたMP/イージー/ロングのうち記録orチェック済みの割合
    const windowItems = planItems.filter(function(p){
      if(!p.date || ['mp','easy','long'].indexOf(p.type)===-1) return false;
      const dt = parseISO(p.date);
      return dt && dt>=windowStart && dt<=today;
    });
    if(windowItems.length>0){
      let doneCount = 0;
      windowItems.forEach(function(p){
        if(completed['w'+p.wi+'-'+p.ii] || logs[p.date]) doneCount++;
      });
      const adherence = doneCount/windowItems.length;
      if(adherence < 0.6){
        factor += (0.6-adherence)*0.15;
        mainFactors.push({ label:'直近4週の実施率', value:Math.round(adherence*100)+'%', impact:'slower' });
      } else {
        mainFactors.push({ label:'直近4週の実施率', value:Math.round(adherence*100)+'%', impact:'good' });
      }
    }

    // 5) MP走の達成度 — 記録された平均ペースとMPペース帯の差
    const mpBand = parsePaceLabel(plan.meta.mpLabel);
    let mpLogCount = 0;
    if(mpBand){
      const mpSecs = [];
      planItems.forEach(function(p){
        if(p.type==='mp' && p.date && logs[p.date] && logs[p.date].avgPace){
          const sec = hmsToSeconds(logs[p.date].avgPace);
          if(sec!=null) mpSecs.push(sec);
        }
      });
      mpLogCount = mpSecs.length;
      if(mpSecs.length){
        const avgMpSec = mpSecs.reduce(function(a,b){ return a+b; },0)/mpSecs.length;
        const bandCenter = (mpBand.low+mpBand.high)/2;
        const diffRatio = (avgMpSec-bandCenter)/bandCenter;
        if(diffRatio>0.02){
          factor += Math.min(0.08, diffRatio*0.5);
          mainFactors.push({ label:'MP走の実施ペース', value:paceSecToLabel(avgMpSec)+'/km(目標よりやや遅め)', impact:'slower' });
        } else if(diffRatio<-0.02){
          factor -= Math.min(0.05, -diffRatio*0.4);
          mainFactors.push({ label:'MP走の実施ペース', value:paceSecToLabel(avgMpSec)+'/km(目標より速め)', impact:'good' });
        } else {
          mainFactors.push({ label:'MP走の実施ペース', value:paceSecToLabel(avgMpSec)+'/km(目標通り)', impact:'good' });
        }
      }
    }

    // 6) 直近の痛み・不調(直近14日) — Phase3で{level, parts}形式の入力UIが揃ったため、level(0〜3)をそのまま考慮する
    let maxPainLevel = 0;
    Object.keys(logs).forEach(function(d){
      const dt = parseISO(d);
      if(dt && dt>=addDays(today,-14) && dt<=today && logs[d] && logs[d].pain){
        const p = logs[d].pain;
        if(typeof p==='object' && p.level!=null) maxPainLevel = Math.max(maxPainLevel, Number(p.level)||0);
        else if(p) maxPainLevel = Math.max(maxPainLevel, 2); // 旧形式(文字列等)が残っていた場合の後方互換フォールバック
      }
    });
    if(maxPainLevel>=3){
      factor += 0.08;
      mainFactors.push({ label:'直近の痛み・不調', value:'強めの記録あり', impact:'slower' });
    } else if(maxPainLevel>0){
      factor += 0.03;
      mainFactors.push({ label:'直近の痛み・不調', value:'軽度の記録あり', impact:'slower' });
    }

    // 7) 残り日数による確信度 — 遠いほど補正を弱め、直前(2週間以内)はほぼそのまま適用
    let confidenceWeight = 1.0;
    if(daysToRace!=null){
      if(daysToRace<=14) confidenceWeight = 1.0;
      else if(daysToRace>=90) confidenceWeight = 0.5;
      else confidenceWeight = 1.0 - (daysToRace-14)/(90-14)*0.5;
    }
    const deviation = (factor-1.0)*confidenceWeight;
    const adjustedSec = baseSec*(1+deviation);

    // 8) 平滑化 — 前回スナップショットと7:3で混ぜ、1回の練習結果だけで大きく跳ねないようにする
    let finalSec;
    if(prevForecast && prevForecast.predictedSec && prevForecast.algorithmVersion===FORECAST_ALGO_VERSION){
      finalSec = Math.round(adjustedSec*0.7 + prevForecast.predictedSec*0.3);
    } else {
      finalSec = Math.round(adjustedSec);
    }

    const predictedMinSec = Math.round(finalSec*0.98);   // 挑戦目標側(速め)は控えめに
    const predictedMaxSec = Math.round(finalSec*1.045);  // 安全目標側(遅め)は後半失速リスクを踏まえやや広めに
    const recommendedGoalSec = roundToNiceGoal(finalSec, raceDistanceKm);

    let confidenceScore = 0;
    if(pb) confidenceScore++;
    if(maxLongRun>0) confidenceScore++;
    if(volSum>0) confidenceScore++;
    if(mpLogCount>0) confidenceScore++;
    const confidence = confidenceScore>=3 ? 'high' : confidenceScore>=1 ? 'medium' : 'low';

    return {
      predictedSec: finalSec,
      predictedMinSec: predictedMinSec,
      predictedMaxSec: predictedMaxSec,
      recommendedGoalSec: recommendedGoalSec,
      challengeGoalSec: predictedMinSec,
      safeGoalSec: predictedMaxSec,
      mainFactors: mainFactors,
      confidence: confidence,
      algorithmVersion: FORECAST_ALGO_VERSION,
      generatedAt: new Date().toISOString()
    };
  }

  function latestForecastFor(planId){
    const doc = state.forecast[planId];
    if(!doc || !doc.history || !doc.history.length) return null;
    return doc.history[doc.history.length-1];
  }

  // targetLabelは通常「H:MM:SS」だが、シードプランのように「H:MM:SS〜H:MM:SS」という
  // レンジ表記の場合もあるため、その場合は中間値を基準タイムとして使う
  function parseTargetLabelToSec(label){
    if(!label) return null;
    if(label.indexOf('〜')>=0){
      const parts = label.split('〜').map(function(s){ return hmsToSeconds(s.trim()); });
      if(parts[0]!=null && parts[1]!=null) return Math.round((parts[0]+parts[1])/2);
      return (parts[0]!=null) ? parts[0] : (parts[1]!=null ? parts[1] : null);
    }
    return hmsToSeconds(label);
  }

  // 練習記録・チェック状況の更新を受けて予想を再計算し、履歴として保存する(直近20件を保持)
  async function recomputeAndSaveForecast(plan){
    if(!plan) return null;
    const fallbackTargetSec = parseTargetLabelToSec(plan.meta.targetLabel);
    const prevForecast = latestForecastFor(plan.id);
    const result = estimateRacePerformance({
      plan: plan,
      pbs: (state.profile && state.profile.pbs) || [],
      logs: state.logs || {},
      completed: state.completed || {},
      today: todayLocal(),
      fallbackTargetSec: fallbackTargetSec,
      prevForecast: prevForecast
    });
    if(!result) return null;
    const prevDoc = state.forecast[plan.id] || { history: [] };
    const history = prevDoc.history.concat([result]).slice(-20);
    state.forecast[plan.id] = { history: history };
    try{ await Store.setForecast(plan.id, state.forecast[plan.id]); }catch(e){}
    return result;
  }

  function recoveryPlanFor(prevPlan){
    // 前の大会の距離に応じて、回復期間・開始日・引き継ぐ現在の最長ロング走を提案する
    const distanceKm = prevPlan.meta.distanceKm || 10;
    const peakLongRunKm = prevPlan.meta.peakLongRunKm || prevPlan.meta.distanceKm || 10;
    let recoveryDays, forceRecoveryWeeks, longRunFraction;
    if(distanceKm>=30){ recoveryDays=10; forceRecoveryWeeks=2; longRunFraction=0.3; }
    else if(distanceKm>=15){ recoveryDays=6; forceRecoveryWeeks=1; longRunFraction=0.4; }
    else{ recoveryDays=3; forceRecoveryWeeks=0; longRunFraction=0.5; }
    const startDate = addDays(parseISO(prevPlan.meta.raceDate), recoveryDays);
    const longRunStart = Math.max(5, Math.round(peakLongRunKm*longRunFraction*2)/2);
    return { startDate, longRunStart, forceRecoveryWeeks };
  }

  function dateForWeekday(weekStart, targetWeekday){
    const offset = ((targetWeekday - weekStart.getDay()) + 7) % 7;
    return addDays(weekStart, offset);
  }

  // プロフィールの走れる曜日から、ポイント走とロング走をできるだけ離して配置する。
  // ロング走は週末を優先し、残りの走行日はすべてイージー走として使う。
  function trainingWeekPattern(availableWeekdays, weeklyRunDays, fallback){
    const days = Array.from(new Set((availableWeekdays||[]).map(Number).filter(function(d){ return d>=0 && d<=6; }))).sort(function(a,b){ return a-b; });
    if(days.length!==weeklyRunDays || days.length<2) return fallback || { mpWeekday:1, easyWeekdays:[3], longWeekday:6 };
    const weekend = days.filter(function(d){ return d===0 || d===6; });
    const longWeekday = weekend.indexOf(0)>=0 ? 0 : (weekend.indexOf(6)>=0 ? 6 : days[days.length-1]);
    const distance = function(a,b){ const diff=Math.abs(a-b); return Math.min(diff,7-diff); };
    const candidates = days.filter(function(d){ return d!==longWeekday; });
    const mpWeekday = candidates.slice().sort(function(a,b){ return distance(b,longWeekday)-distance(a,longWeekday) || a-b; })[0];
    return { mpWeekday, longWeekday, easyWeekdays: days.filter(function(d){ return d!==longWeekday && d!==mpWeekday; }) };
  }

  // プランの週は常に月曜始まり・日曜終わり。開始日が週の途中なら、Week 1はその日以降だけを使う。
  function mondayOfWeek(date){
    return addDays(date, -((date.getDay()+6)%7));
  }
  function nextMonday(date){
    const monday = mondayOfWeek(date);
    return date.getDay()===1 ? monday : addDays(monday, 7);
  }
  function isPlanItemDate(date, weekStart, cfg){
    const weekEnd = addDays(weekStart, 6);
    return date >= cfg.startDate && date <= cfg.raceDate && date >= weekStart && date <= weekEnd;
  }

  function generatePlan(cfg){
    // cfg: {name, distanceLabel, distanceKm, raceDate(Date), startDate(Date), targetSec, longRunStart, heelCaution,
    //       injuryNote, courseNote, constitutionNote, scheduleNote, mpWeekday, easyWeekday, longWeekday}
    const tier = pickTier(cfg.distanceKm);
    const conf = TIER_CONF[tier];
    const mpTemplates = MP_TEMPLATE_SETS[tier];
    const band = paceBandFromTarget(cfg.targetSec, cfg.distanceKm, conf.gapMult);
    const firstWeekStart = mondayOfWeek(cfg.startDate);
    const raceWeekStart = mondayOfWeek(cfg.raceDate);
    const weeksTotal = Math.max(1, Math.floor(daysBetween(firstWeekStart, raceWeekStart)/7)+1);
    const taperWeeks = weeksTotal>=8 ? 2 : (weeksTotal>=5 ? 1 : 0);
    const buildWeeks = Math.max(1, weeksTotal-taperWeeks);
    const baseCount = Math.ceil(buildWeeks/2);
    const returnWeeks = (cfg.forceRecoveryWeeks!=null) ? Math.max(0, Math.min(cfg.forceRecoveryWeeks, buildWeeks-1)) : (buildWeeks>=6 ? 1 : 0); // 復帰期: 前の大会からの続きの場合は強制的に確保、それ以外は長い期間のみ
    const peakCap = Math.max(cfg.distanceKm*conf.peakMult, cfg.longRunStart*1.1);
    const peakWeekIndex = buildWeeks-1;
    const mpWeekday = (cfg.mpWeekday!=null) ? cfg.mpWeekday : 1;
    const easyWeekdays = (cfg.easyWeekdays && cfg.easyWeekdays.length) ? cfg.easyWeekdays : [(cfg.easyWeekday!=null) ? cfg.easyWeekday : 3];
    const longWeekday = (cfg.longWeekday!=null) ? cfg.longWeekday : 6;
    const restWeekday = (longWeekday+1)%7;

    let longRun = cfg.longRunStart;
    let prevLong = null;
    let maxLongDist = 0;
    const weeks = [];

    for(let w=0; w<weeksTotal; w++){
      const weekStart = addDays(firstWeekStart, w*7);
      const isRaceWeek = toISO(weekStart)===toISO(raceWeekStart);
      const isTaperOnly = !isRaceWeek && (w>=buildWeeks);
      let phase;
      if(isRaceWeek) phase = 'レース週';
      else if(isTaperOnly) phase = 'テーパー'+(w-buildWeeks+1);
      else if(w<returnWeeks) phase = '復帰期';
      else if(w<baseCount) phase = 'ベース構築'+(w-returnWeeks+1);
      else phase = 'ピーク期'+(w-baseCount+1)+(w===peakWeekIndex?'(最大負荷週)':'');

      const items = [];

      if(isRaceWeek){
        const raceDate = cfg.raceDate;
        const mpDate = addDays(raceDate,-5);
        const easyDate = addDays(raceDate,-3);
        const preDate = addDays(raceDate,-1);
        const tpl = {reps:2, dist:conf.raceDist, jog:0, light:true};
        if(isPlanItemDate(mpDate, weekStart, cfg)) items.push({type:'mp', day:WEEKDAY_JA[mpDate.getDay()], date:toISO(mpDate), title:'MP走', desc:'(軽め) '+mpDesc(tpl, band.mpLabel)});
        if(isPlanItemDate(easyDate, weekStart, cfg)) items.push({type:'easy', day:WEEKDAY_JA[easyDate.getDay()], date:toISO(easyDate), title:'イージー', desc:formatKm(Math.max(conf.easyFloor,Math.round(longRun*0.18)))+'('+band.easyLabel+')、流し(スピード刺激)を2〜3本'});
        if(daysBetween(weekStart, raceDate)>0) items.push({type:'rest', day:'レース前', date:null, title:'完全休養', desc:'or 軽いウォーク'});
        if(isPlanItemDate(preDate, weekStart, cfg)) items.push({type:'preRace', day:WEEKDAY_JA[preDate.getDay()], date:toISO(preDate), title:'前日調整', desc:'20〜30分の超軽いジョグ or 完全休養、カーボローディング開始'});
        items.push({type:'race', day:WEEKDAY_JA[raceDate.getDay()], date:toISO(raceDate), title:'レース本番', desc:cfg.name+' — 目標 '+cfg.targetLabel});
      } else {
        const mpDate = dateForWeekday(weekStart, mpWeekday);
        const longDate = dateForWeekday(weekStart, longWeekday);
        const restDate = dateForWeekday(weekStart, restWeekday);

        let longDist, flag=null, note='';
        if(w<returnWeeks){
          longDist = Math.max(conf.easyFloor, Math.round(cfg.longRunStart*0.7*2)/2);
          note = '復帰期。まずは無理のない距離で体を慣らす';
        } else if(isTaperOnly){
          longDist = Math.round(longRun*0.6*2)/2;
          note = 'テーパー期。ジェル練習は継続';
        } else {
          longDist = Math.min(peakCap, longRun);
          if(prevLong!=null && cfg.heelCaution){
            const pct = Math.round((longDist/prevLong-1)*100);
            if(pct>=20) flag = {kind:'heel', text:'前週比+'+pct+'%。違和感が出たら10〜20%落として様子見'};
          }
          if(w===peakWeekIndex){
            const mpPart = Math.round(longDist*0.35);
            note = '前半'+Math.round(longDist-mpPart)+'kmイージー、後半'+mpPart+'kmはMPペース挑戦';
          } else if(w===peakWeekIndex-1 && w>=baseCount){
            const mpPart = Math.max(3,Math.round(longDist*0.2));
            note = '後半'+mpPart+'kmだけMPペース挑戦';
          }
          prevLong = longDist;
          maxLongDist = Math.max(maxLongDist, longDist);
          longRun = Math.min(peakCap, longRun*(w<baseCount?1.15:1.12));
        }

        const durationMin = longDist*((band.easyLow+band.easyHigh)/2)/60;
        const gel = gelSchedule(durationMin);
        let longDesc = formatKm(longDist)+'('+band.easyLabel+')';
        if(gel) longDesc += '、'+gel.join('・')+'分でジェル補給';
        if(note) longDesc += '。'+note;

        const mpTpl = isTaperOnly ? {reps:2, dist:conf.taperDist, jog:3} : mpTemplates[Math.min(w, mpTemplates.length-1)];
        const easyDist = Math.max(conf.easyFloor, Math.round(longDist*conf.easyRatio));

        if(isPlanItemDate(mpDate, weekStart, cfg)) items.push({type:'mp', day:WEEKDAY_JA[mpDate.getDay()], date:toISO(mpDate), title:'MP走', desc:mpDesc(mpTpl, band.mpLabel)});
        easyWeekdays.forEach(function(easyWeekday){
          const easyDate = dateForWeekday(weekStart, easyWeekday);
          if(isPlanItemDate(easyDate, weekStart, cfg)) items.push({type:'easy', day:WEEKDAY_JA[easyDate.getDay()], date:toISO(easyDate), title:'イージー', desc:formatKm(easyDist)+'('+band.easyLabel+')'});
        });
        if(isPlanItemDate(longDate, weekStart, cfg)) items.push({type:'long', day:WEEKDAY_JA[longDate.getDay()], date:toISO(longDate), title:'ロング走', desc:longDesc, flag: flag?flag.kind:null, flagText: flag?flag.text:null, peak: w===peakWeekIndex});
        if(isPlanItemDate(restDate, weekStart, cfg)) items.push({type:'rest', day:WEEKDAY_JA[restDate.getDay()], date:toISO(restDate), title:'完全休養', desc:''});
      }

      items.sort(function(a,b){ return (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'); });
      const rangeStart = weekStart, rangeEnd = addDays(weekStart,6);
      weeks.push({ label:'Week '+(w+1), phase, dateRange:fmtMD(rangeStart)+'〜'+fmtMD(rangeEnd), items });
    }

    return {
      id: 'plan-'+Date.now().toString(36),
      createdAt: toISO(todayLocal()),
      meta:{
        name: cfg.name,
        distanceLabel: cfg.distanceLabel,
        distanceKm: cfg.distanceKm,
        raceDate: toISO(cfg.raceDate),
        startDate: toISO(cfg.startDate),
        targetLabel: cfg.targetLabel,
        mpLabel: band.mpLabel,
        easyLabel: band.easyLabel,
        pbLabel: cfg.pbLabel || null,
        heelCaution: cfg.heelCaution,
        injuryNote: cfg.injuryNote || null,
        courseNote: cfg.courseNote || null,
        constitutionNote: cfg.constitutionNote || null,
        scheduleNote: cfg.scheduleNote || null,
        source: 'generated',
        linkedFromPlanId: cfg.linkedFromPlanId || null,
        peakLongRunKm: Math.round((maxLongDist || cfg.longRunStart)*10)/10,
        policy: [
          WEEKDAY_JA[mpWeekday]+':MP走(marathon pace) / '+easyWeekdays.map(function(d){ return WEEKDAY_JA[d]; }).join('・')+':イージー / '+WEEKDAY_JA[longWeekday]+':ロング走 / '+WEEKDAY_JA[restWeekday]+':完全休養(残りは休息 or 軽い活動)',
          cfg.injuryNote ? cfg.injuryNote+'への配慮 → 距離・強度の増加は段階的に。違和感が出たら即座に落とす' : '週間距離の急増(前週比+20%超)は避ける',
          '60〜70分あたりから補給ジェルを練習に組み込み、本番の"壁"対策を仕込む'
        ].concat(cfg.linkedFromPlanId && returnWeeks>0 ? ['前の大会からの継続プランのため、最初の'+returnWeeks+'週間は回復期として距離を抑える'] : [])
      },
      weeks,
      extras:{
        fueling:[
          '開始60〜70分から、以降30〜40分毎にジェル(レース後半の"壁"対策)',
          'ピーク期のロング走で実際の間隔・銘柄を固定し、本番でぶっつけにしない'
        ],
        cautions:[
          cfg.injuryNote ? '違和感(' +cfg.injuryNote+ ')が出たら、その週のロング走・MP走の距離を10〜20%落として様子見' : '痛みや強い張りが出たら無理せず距離を落とす',
          '週間距離の急増(前週比+20%超)は避ける。本プランは概ね10〜25%の漸増ペース',
          '30km級の高強度ロング走の後は中3〜4日の回復を意識する',
          'MP走翌日は基本オフ。疲労が強ければイージーも短縮可'
        ]
      },
      history: []
    };
  }

  /* ============================================================

  ============================================================ */
  let db = null;

  const Store = {
    async listPlans(){
      if(db){
        const snap = await db.collection('plans').get();
        return snap.docs.map(d=>d.data());
      }
      try{ return JSON.parse(localStorage.getItem('paceplan.plans')||'[]'); }catch(e){ return []; }
    },
    async savePlan(plan){
      if(db){ await db.collection('plans').doc(plan.id).set(plan); return; }
      try{
        const list = JSON.parse(localStorage.getItem('paceplan.plans')||'[]');
        const idx = list.findIndex(p=>p.id===plan.id);
        if(idx>=0) list[idx]=plan; else list.push(plan);
        localStorage.setItem('paceplan.plans', JSON.stringify(list));
      }catch(e){}
    },
    async deletePlan(id){
      if(db){
        await db.collection('plans').doc(id).delete();
        await db.doc('progress/'+id).delete();
        await db.doc('logs/'+id).delete();
        await db.doc('forecast/'+id).delete();
        await db.doc('coachLog/'+id).delete();
        return;
      }
      try{
        const list = JSON.parse(localStorage.getItem('paceplan.plans')||'[]').filter(p=>p.id!==id);
        localStorage.setItem('paceplan.plans', JSON.stringify(list));
        localStorage.removeItem('paceplan.progress.'+id);
        localStorage.removeItem('paceplan.logs.'+id);
        localStorage.removeItem('paceplan.forecast.'+id);
        localStorage.removeItem('paceplan.coachLog.'+id);
      }catch(e){}
    },
    async getProgress(id){
      if(db){
        const snap = await db.doc('progress/'+id).get();
        return snap.exists ? (snap.data().completed||{}) : {};
      }
      try{ return JSON.parse(localStorage.getItem('paceplan.progress.'+id)||'{}'); }catch(e){ return {}; }

      if(db){ await db.doc('progress/'+id).set({completed}); return; }

      if(db){ await db.doc('logs/'+id).set({entries}); return; }

        return snap.exists ? snap.data() : null;

    async setForecast(id, data){
      if(db){ await db.doc('forecast/'+id).set(data); return; }
      try{ localStorage.setItem('paceplan.forecast.'+id, JSON.stringify(data)); }catch(e){}
    },
    // AIコーチのチャット履歴(Phase7: チャットUI化)。重い項目(選択肢のplan本体・undo用スナップショット等)は
    // 呼び出し側(persistCoachLog)で除いてから渡される想定
    async getCoachLog(id){
      if(db){
        const snap = await db.doc('coachLog/'+id).get();
        return snap.exists ? (snap.data().messages||[]) : [];
      }
      try{ return JSON.parse(localStorage.getItem('paceplan.coachLog.'+id)||'[]'); }catch(e){ return []; }
    },
    async setCoachLog(id, messages){
      if(db){ await db.doc('coachLog/'+id).set({messages}); return; }
      try{ localStorage.setItem('paceplan.coachLog.'+id, JSON.stringify(messages)); }catch(e){}
    },
    // 手動・スクリーンショット・HealthKit等を横断する共通Workoutの保存先。
    // 既存の予定日別logsを置換せず、取り込み元IDによる重複防止の正本として追加する。
    async getWorkouts(){
      if(db){ const snap=await db.doc('workouts/main').get(); return snap.exists ? (snap.data().entries||[]) : []; }
      try{ return JSON.parse(localStorage.getItem('paceplan.workouts')||'[]'); }catch(e){ return []; }
    },
    async setWorkouts(entries){
      if(db){ await db.doc('workouts/main').set({entries:entries}); return; }
      try{ localStorage.setItem('paceplan.workouts', JSON.stringify(entries)); }catch(e){}
    },
    async getProfile(){
      const empty = { name:null, injuryNote:null, courseNote:null, constitutionNote:null, scheduleNote:null, pbs:[], shoes:[], weeklyRunDays:null, availableWeekdays:[], longRunWeekday:null, longestRunManualKm:null, workoutUserId:null, healthConnections:{autoImport:true, appleHealth:{enabled:false,lastSyncedAt:null}, healthConnect:{enabled:false,lastSyncedAt:null}} };
      const withDefaults = function(raw){
        const profile = Object.assign({}, empty, raw||{});
        const connections = (raw&&raw.healthConnections)||{};
        profile.healthConnections = {
          autoImport: connections.autoImport!==false,
          appleHealth: Object.assign({enabled:false,lastSyncedAt:null}, connections.appleHealth||{}),
          healthConnect: Object.assign({enabled:false,lastSyncedAt:null}, connections.healthConnect||{})
        };
        return profile;
      };
      if(db){
        const snap = await db.doc('profile/main').get();
        return snap.exists ? withDefaults(snap.data()) : empty;
      }
      try{
        const raw = localStorage.getItem('paceplan.profile');
        return raw ? withDefaults(JSON.parse(raw)) : empty;
      }catch(e){ return empty; }
    },
    async setProfile(profile){
      if(db){ await db.doc('profile/main').set(profile); return; }
      try{ localStorage.setItem('paceplan.profile', JSON.stringify(profile)); }catch(e){}
    }

    if(item.type==='race') return raceDatePassed;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function isLoggable(it){ return !!it.date && it.type!=='rest'; }

  function findItemByDate(plan, dateStr){
    for(let wi=0; wi<plan.weeks.length; wi++){
      const wk = plan.weeks[wi];
      for(let ii=0; ii<wk.items.length; ii++){
        if(wk.items[ii].date===dateStr) return { it:wk.items[ii], wi, ii, week:wk };
      }
    }
    return null;
  }

  function resetCompletedForChangedWeeks(oldWeeks, newWeeks, completed){
    const next = Object.assign({}, completed);
    const len = Math.max(oldWeeks.length, newWeeks.length);
    for(let i=0;i<len;i++){
      const same = JSON.stringify(oldWeeks[i]||null)===JSON.stringify(newWeeks[i]||null);
      if(!same){
        Object.keys(next).forEach(k=>{ if(k.indexOf('w'+i+'-')===0) delete next[k]; });
      }
    }
    return next;
  }
